<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas Eléctrico de México</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Concepto: tablero de estudio con barra de módulos arriba, pestañas de sección fijas y paneles de gráfica + detalle.
   Identidad: solo los 4 tonos del kit Ultravioleta v1.0 (valores muestreados del kit, validar contra HEX oficial). Arial Bold / Regular. */
:root{
  --pn:#32095F; --vr:#4B1C8F; --uv:#8E4DF2; --ls:#E4CCFF;
  --bg:#F4F0FB; --surface:#FFFFFF; --surface2:#EFE6FC; --ink:#1F0645; --ink2:#4B1C8F;
  --muted:color-mix(in srgb,var(--ink) 68%,var(--surface)); --line:color-mix(in srgb,var(--ink) 16%,var(--surface));
  --c-F:#32095F; --c-N:#E4CCFF; --c-Nline:#4B1C8F; --c-R:#8E4DF2;
  --accent:#8E4DF2; --on-accent:#FFFFFF; --hd:#32095F; --on-hd:#FFFFFF; --focus:#8E4DF2;
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1F0645; --surface:#32095F; --surface2:color-mix(in srgb,#4B1C8F 55%,#32095F); --ink:#F4F0FB; --ink2:#E4CCFF;
  --c-F:#E4CCFF; --c-N:#4B1C8F; --c-Nline:#E4CCFF; --c-R:#8E4DF2; --hd:#1F0645; --focus:#E4CCFF; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1F0645; --surface:#32095F; --surface2:color-mix(in srgb,#4B1C8F 55%,#32095F); --ink:#F4F0FB; --ink2:#E4CCFF;
  --c-F:#E4CCFF; --c-N:#4B1C8F; --c-Nline:#E4CCFF; --c-R:#8E4DF2; --hd:#1F0645; --focus:#E4CCFF; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hd)}
h1,h2,h3,h4{font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:22px}h3{font-size:17px}h4{font-size:14px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto}
.band{margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--hd);color:var(--on-hd);padding-block:14px 12px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.logo{height:40px;width:auto;border-radius:6px;background:#fff;padding:2px 6px;display:block}
.ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.ttl b{font-size:18px}.ttl span{font-size:12px;opacity:.85}
.mods{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.mod{border:1px solid color-mix(in srgb,#fff 35%,transparent);background:transparent;color:var(--on-hd);padding:6px 12px;border-radius:999px;font-size:13px}
.mod[aria-current="page"]{background:var(--ls);color:var(--pn);border-color:var(--ls);font-weight:700}
.mod[disabled]{opacity:.6;cursor:not-allowed}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.tabs [role=tablist]{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;max-width:1180px;margin:0 auto}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--vr);color:#fff;border-color:var(--vr);font-weight:700}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:var(--uv)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{background:var(--uv)}}
main{padding-top:20px;display:flex;flex-direction:column;gap:20px}
section.panel{display:flex;flex-direction:column;gap:16px}
.lead{color:var(--muted);max-width:75ch}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.alt{background:var(--surface2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:1;padding:4px 7px;border-radius:5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.b-of{background:var(--pn);color:#fff;border:1px solid var(--pn)}
:root[data-theme="dark"] .b-of{background:var(--ls);color:var(--pn);border-color:var(--ls)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b-of{background:var(--ls);color:var(--pn);border-color:var(--ls)}}
.b-ca{border:1.5px solid var(--ink2);color:var(--ink2)}
.b-si{border:1.5px dashed var(--ink2);color:var(--ink2)}
.b-es{border:1.5px dotted var(--ink2);color:var(--ink2)}
.b-co{background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.b-sc{background:var(--ls);color:var(--pn)}
.tip{border-bottom:1.5px dotted var(--ink2);cursor:help;text-decoration:none}
.tip:focus-visible{outline-offset:1px}
#tooltip{position:fixed;z-index:60;max-width:min(340px,calc(100vw - 24px));background:var(--pn);color:#fff;border:1px solid var(--ls);
  padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.45;box-shadow:0 6px 20px rgba(31,6,69,.35);pointer-events:none}
#tooltip .tt-t{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ls);margin-bottom:4px;font-weight:700}
#tooltip .tt-s{margin-top:6px;font-size:11px;color:var(--ls)}
.chain{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;position:relative;min-width:0;display:flex;flex-direction:column;gap:4px}
.step small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.step b{font-size:15px}
.step:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--ink2);font-weight:700;z-index:2;background:var(--bg);border-radius:50%;width:16px;text-align:center;line-height:16px}
@media (max-width:720px){.chain{grid-template-columns:1fr}.step:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-12px;transform:translateX(-50%)}}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.pill[aria-pressed="true"],.pill[aria-selected="true"]{background:var(--vr);color:#fff;border-color:var(--vr);font-weight:700}
:root[data-theme="dark"] .pill[aria-pressed="true"]{background:var(--uv)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill[aria-pressed="true"]{background:var(--uv)}}
.fam{border-top:5px solid var(--c-F)}.fam.N{border-top-color:var(--c-Nline)}.fam.R{border-top-color:var(--c-R)}
.chip{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px;margin:0 4px 4px 0}
button.chip{cursor:pointer}button.chip[aria-pressed="true"]{background:var(--vr);color:#fff;border-color:var(--vr)}
.note{font-size:13px;color:var(--muted)}
.callout{border-left:4px solid var(--uv);background:var(--surface2);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
.sets{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;align-items:stretch}
.set{border:2px solid var(--ink2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.set.inner{border-style:dashed;background:var(--surface2)}
.set h4{font-size:13px}
@media (max-width:640px){.sets{grid-template-columns:1fr}}
/* barras */
.brow{display:grid;grid-template-columns:minmax(96px,150px) 1fr minmax(70px,auto);gap:8px;align-items:center;padding:3px 0;border-radius:6px}
.brow:hover,.brow:focus-visible{background:var(--surface2)}
.bl{font-size:13px;min-width:0}
.bt{height:12px;background:color-mix(in srgb,var(--ink) 8%,var(--surface));border-radius:0 4px 4px 0;position:relative}
.bt.two{height:22px;background:none;display:flex;flex-direction:column;gap:2px}
.bf{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.two .bf{height:10px}
.two .bf.prev{opacity:.45}
.bv{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.c-F{background:var(--c-F)}.c-R{background:var(--c-R)}
.c-N{background:repeating-linear-gradient(45deg,var(--c-N) 0 4px,color-mix(in srgb,var(--c-Nline) 55%,var(--c-N)) 4px 6px);box-shadow:inset 0 0 0 1.5px var(--c-Nline)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.stack{display:flex;height:34px;gap:2px;border-radius:6px;overflow:hidden}
.seg{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;min-width:0;overflow:hidden;color:#fff}
.seg.c-F{color:var(--surface)}.seg.c-N{color:var(--ink)}
:root:not([data-theme="dark"]) .seg.c-F{color:#fff}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:30px;font-variant-numeric:tabular-nums;color:var(--ink2);line-height:1.05}
.kpi span{font-size:12px;color:var(--muted)}
/* clasificador */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:10px;border:1px dashed var(--ink2);border-radius:10px}
.kc{border:1.5px solid var(--ink2);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;cursor:grab;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left}
.kc small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kc[aria-pressed="true"]{background:var(--vr);color:#fff;border-color:var(--vr)}
.kc[aria-pressed="true"] small{color:var(--ls)}
.kc.ok{cursor:default;background:var(--surface2)}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.zone{border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:150px;background:var(--surface)}
.zone.over{border-color:var(--uv);background:var(--surface2)}
.zone .place{align-self:flex-start;border:1.5px solid var(--ink2);background:transparent;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:700}
.zone .place:disabled{opacity:.4;cursor:not-allowed}
.zl{display:flex;flex-wrap:wrap;gap:6px}
.feedback{border:1.5px solid var(--ink2);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--surface2);min-height:48px}
.feedback.bad{border-style:dashed}
.score{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.score b{font-size:20px;font-variant-numeric:tabular-nums}
.btn{border:1.5px solid var(--ink2);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:700;font-size:13px}
.btn.pri{background:var(--vr);border-color:var(--vr);color:#fff}
:root[data-theme="dark"] .btn.pri{background:var(--uv);border-color:var(--uv)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{background:var(--uv);border-color:var(--uv)}}
/* conversión */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:0}
.node{flex:1 1 130px;min-width:0;border:1.5px solid var(--ink2);background:var(--surface);border-radius:10px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:3px;position:relative}
.node small{font-size:11px;color:var(--muted)}
.node[aria-pressed="true"]{background:var(--vr);color:#fff;border-color:var(--vr)}
.node[aria-pressed="true"] small{color:var(--ls)}
.arrow{flex:0 0 28px;display:flex;align-items:center;justify-content:center;position:relative;color:var(--ink2);font-weight:700}
.arrow::before{content:"";position:absolute;left:2px;right:2px;top:50%;height:2px;background:repeating-linear-gradient(90deg,var(--uv) 0 6px,transparent 6px 10px);background-size:20px 2px;animation:dash 1s linear infinite}
.arrow::after{content:"▶";font-size:10px;position:absolute;right:0;top:50%;transform:translateY(-50%)}
@keyframes dash{to{background-position:20px 0}}
@media (max-width:720px){.flow{flex-direction:column}.arrow{flex:0 0 26px;height:26px}.arrow::before{left:50%;right:auto;top:2px;bottom:2px;width:2px;height:auto;background:repeating-linear-gradient(180deg,var(--uv) 0 6px,transparent 6px 10px);background-size:2px 20px;animation:dashv 1s linear infinite}.arrow::after{content:"▼";right:auto;left:50%;top:auto;bottom:0;transform:translateX(-50%)}}
@keyframes dashv{to{background-position:0 20px}}
@media (prefers-reduced-motion:reduce){.arrow::before{animation:none}}
.ener{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
/* comparador */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-weight:700;background:var(--surface2)}
tbody th{width:150px;background:var(--surface)}
tr:last-child td,tr:last-child th{border-bottom:0}
/* quiz */
.opts{display:flex;flex-direction:column;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;text-align:left;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--uv)}
.opt.sel{border-color:var(--ink2);border-width:2px}
.opt.right{border-color:var(--uv);background:var(--surface2);border-width:2.5px}
.opt.wrong{border-style:dashed;border-width:2px}
.opt:disabled{cursor:default}
.qn{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
input[type=range]{width:100%;accent-color:var(--uv)}
.src{font-size:12px;color:var(--muted)}
.src b{color:var(--ink)}
footer{margin-top:10px;display:flex;flex-direction:column;gap:12px}
details{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 14px}
summary{cursor:pointer;font-weight:700}
details ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px}
</style>
</head>

<script>
"use strict";
/* ========== utilidades ========== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(n,d=0)=>Number(n).toLocaleString('es-MX',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(a,b,d=1)=>fmt(100*a/b,d)+' %';
const say=t=>{$('#live').textContent=t};
const D24='Informe Anual 2024 CFE';
const TYPES={of:['Oficial','b-of'],ca:['Cálculo','b-ca'],si:['Simulación','b-si'],es:['Estimación','b-es'],co:['Concepto','b-co']};
const bd=(t,extra)=>`<span class="badge ${TYPES[t][1]}" data-t="${esc(extra||({of:'Dato publicado en un documento oficial cargado.',ca:'Operación aritmética hecha sobre datos oficiales.',si:'Resultado de un modelo con supuestos editables.',es:'Valor inferido con supuestos; no es un dato publicado.',co:'Explicación técnica de apoyo; no es un dato.'})[t])}" tabindex="0">${TYPES[t][0]}</span>`;
const sc=(s,t)=>`<span class="badge b-sc" data-t="${esc(t)}" tabindex="0">${s}</span>`;
const SCOPE={cfe:sc('CFE','Datos exclusivos de la Comisión Federal de Electricidad, sin Productores Independientes de Energía (PIE).'),
  pie:sc('CFE + PIE','CFE más los Productores Independientes de Energía. No es el total nacional.'),
  sen:sc('Nacional (SEN)','Sistema Eléctrico Nacional según PRODESEN: todas las centrales interconectadas.')};

/* ========== glosario / tooltips ========== */
const G={
 primario:{t:'Concepto técnico',x:'Recurso energético primario: energía tal como existe en la naturaleza, antes de transformarla (por ejemplo la radiación solar, el viento, el agua en un embalse, el uranio o el petróleo y el gas en yacimientos).'},
 combustible:{t:'Concepto técnico',x:'Fuente o combustible: la forma de energía que entra a la central. Puede ser el recurso primario sin cambios (viento, sol) o un derivado ya procesado (combustóleo y diésel salen del petróleo).'},
 conversion:{t:'Concepto técnico',x:'Proceso de conversión: el fenómeno físico que transforma la energía de la fuente en otra forma, por ejemplo combustión (química a térmica), fisión (nuclear a térmica) o efecto fotovoltaico (luz a electricidad).'},
 tecnologia:{t:'Concepto técnico',x:'Tecnología de generación: el tipo de central o equipo que realiza la conversión, por ejemplo ciclo combinado, aerogenerador o central hidroeléctrica.'},
 electricidad:{t:'Concepto técnico',x:'Electricidad producida: salida del generador (o del inversor en fotovoltaica). Se mide en energía (GWh) y la capacidad de la central en potencia (MW).'},
 fosil:{t:'Definición legal',x:'Energías Fósiles: las que provienen de la combustión de materiales en estado sólido, líquido o gaseoso que contienen carbono y que se formaron por procesos geológicos o se obtuvieron a partir de estos.',s:'Ley de Planeación y Transición Energética, decreto DOF 18-mar-2025 (PDF completo, p. 192)'},
 renovable:{t:'Definición legal',x:'Energías Renovables: aquellas cuya fuente se regenera naturalmente a escala del tiempo humano. La ley enumera viento, radiación solar, movimiento del agua en cauces naturales o embalses ya existentes, energía oceánica, calor interno de la tierra y los energéticos que determine la Ley de Biocombustibles. No incluye la nuclear.',s:'Ley de Planeación y Transición Energética, DOF 18-mar-2025 (PDF completo, p. 192)'},
 limpia:{t:'Definición legal',x:'Energías Limpias: fuentes y procesos cuyas emisiones o residuos no rebasan los umbrales de la regulación. La lista incluye viento, radiación solar, geotermia, hidroeléctricas, biocombustibles y metano de residuos, y también la energía nucleoeléctrica.',s:'Ley del Sector Eléctrico, DOF 18-mar-2025 (extracto p. 3; decreto completo p. 85)'},
 nuclear:{t:'Clasificación',x:'La energía nuclear es limpia según la Ley del Sector Eléctrico, pero no es renovable: el uranio no se regenera a escala humana y no figura en la lista de fuentes renovables.'},
 fision:{t:'Concepto técnico',x:'Fisión nuclear: un núcleo de uranio-235 absorbe un neutrón y se divide, liberando calor y más neutrones. El calor produce el vapor que mueve la turbina.'},
 gwh:{t:'Unidad',x:'GWh (gigawatt-hora): energía. 1 GWh = 1 000 MWh = 10⁶ kWh. Un equipo de 1 MW operando una hora entrega 1 MWh.'},
 mw:{t:'Unidad',x:'MW (megawatt): potencia, es decir, la rapidez con que una central puede entregar energía. La capacidad efectiva es la potencia que la central puede sostener realmente.'},
 tj:{t:'Unidad',x:'TJ (terajoule): energía contenida en el combustible que entra a la central. 1 GWh de electricidad equivale a 3.6 TJ.'},
 bruta:{t:'Concepto técnico',x:'Generación bruta: la que sale del generador. La neta es la bruta menos el consumo propio de la central (servicios auxiliares).'},
 pie:{t:'Término',x:'PIE: Productor Independiente de Energía. Genera con sus propias centrales y vende a CFE; el Informe 2024 lo presenta por separado de la generación de CFE.'},

/* tooltip: hover, foco y toque */
const tt=$('#tooltip');let ttFor=null;
function showTip(el){
  let html='';
  if(el.dataset.g){const g=G[el.dataset.g];if(!g)return;html=`<div class="tt-t">${g.t}</div>${esc(g.x)}${g.s?`<div class="tt-s">Fuente: ${esc(g.s)}</div>`:''}`;}
  else if(el.dataset.t){html=esc(el.dataset.t);} else return;
  tt.innerHTML=html;tt.hidden=false;ttFor=el;el.setAttribute('aria-describedby','tooltip');
  const r=el.getBoundingClientRect(),w=tt.offsetWidth,h=tt.offsetHeight;
  let x=Math.min(Math.max(12,r.left+r.width/2-w/2),innerWidth-w-12),y=r.bottom+8;
  if(y+h>innerHeight-8)y=Math.max(8,r.top-h-8);
  tt.style.left=x+'px';tt.style.top=y+'px';
}
function hideTip(){if(ttFor)ttFor.removeAttribute('aria-describedby');tt.hidden=true;ttFor=null}
const tipEl=e=>e.target.closest&&e.target.closest('[data-g],[data-t]');
document.addEventListener('mouseover',e=>{const el=tipEl(e);if(el&&el!==ttFor)showTip(el)});
document.addEventListener('mouseout',e=>{const el=tipEl(e);if(el&&!el.contains(e.relatedTarget))hideTip()});
document.addEventListener('focusin',e=>{const el=tipEl(e);if(el)showTip(el)});
document.addEventListener('focusout',e=>{if(tipEl(e))hideTip()});
document.addEventListener('click',e=>{const el=tipEl(e);if(el&&!el.matches('button,a')){ttFor===el&&!tt.hidden?hideTip():showTip(el)}else if(!el)hideTip()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});
addEventListener('scroll',hideTip,{passive:true});

function sec2(){

  const z=$('#zones');
  Object.entries(ZN).forEach(([k,n])=>{const d=document.createElement('div');d.className='zone';d.dataset.z=k;
    d.innerHTML=`<h3>${n}</h3><button class="place" disabled>Colocar aquí</button><div class="zl"></div>`;z.append(d);
    d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');
    d.ondrop=e=>{e.preventDefault();d.classList.remove('over');const id=e.dataTransfer.getData('text/plain');if(id!=='')tryPlace(+id,k)};

function drawPool(){
  const pool=$('#pool');pool.innerHTML='';
  CARDS.filter(c=>!(c.id in cl.placed)).forEach(c=>{const b=document.createElement('button');b.className='kc';b.draggable=true;b.setAttribute('aria-pressed',cl.sel===c.id);
    b.innerHTML=`<small>${c.kind}</small>${esc(c.n)}`;b.ondragstart=e=>{e.dataTransfer.setData('text/plain',c.id);cl.sel=c.id};
    b.onclick=()=>{cl.sel=cl.sel===c.id?null:c.id;drawPool();if(cl.sel!=null)say(c.n+' seleccionada. Elige una zona.')};pool.append(b)});
  $$('.zone .place').forEach(p=>p.disabled=cl.sel==null);
  $('#sOk').textContent=cl.ok;$('#sEr').textContent=cl.err;$('#sPe').textContent=CARDS.length-Object.keys(cl.placed).length;
  if(!pool.children.length)pool.innerHTML=`<b>Terminaste: ${cl.ok} aciertos y ${cl.err} errores.</b>`;
}
function tryPlace(id,z){
  const c=CARDS[id],fb=$('#clFb');
  if(c.a===z){cl.placed[id]=z;cl.ok++;cl.sel=null;
    const b=document.createElement('span');b.className='kc ok';b.innerHTML=`<small>${c.kind}</small>${esc(c.n)}`;$(`.zone[data-z="${z}"] .zl`).append(b);
    fb.className='feedback';fb.innerHTML=`<b>✓ Correcto.</b> ${esc(c.n)} → ${ZN[z]}. ${esc(c.why)}`;say('Correcto. '+c.why);}
  else{cl.err++;fb.className='feedback bad';
    const extra=c.a==='D'?'No se puede forzar una clasificación única: ':z==='D'?'Esta tarjeta sí tiene una clasificación definida (':'';
    fb.innerHTML=`<b>✕ No va en ${ZN[z]}.</b> ${c.a==='D'?esc(c.why):`${esc(c.n)} pertenece a ${ZN[c.a]}. ${esc(c.why)}`}`;say('Incorrecto. '+c.why);}
  drawPool();
}

let cmp=['gas','uran','sol'];
function sec5(){
  $('#p-comparador').innerHTML=`<div><h2>Comparador energético</h2><p class="lead">Selecciona de 2 a 4 recursos. Los valores de emisiones no se inventan: lo que no está en los documentos se marca como pendiente.</p></div>
  <div class="pills" id="cmpPills" role="group" aria-label="Recursos a comparar"></div>
  <div id="cmpOut" aria-live="polite"></div>`;
  const p=$('#cmpPills');RES.forEach(r=>{const b=document.createElement('button');b.className='pill';b.textContent=r.n;b.dataset.id=r.id;
    b.onclick=()=>{const i=cmp.indexOf(r.id);if(i>=0){if(cmp.length>2)cmp.splice(i,1)}else{if(cmp.length>=4)cmp.shift();cmp.push(r.id)}drawCmp()};p.append(b)});
  drawCmp();
}
function drawCmp(){
  $$('#cmpPills .pill').forEach(b=>b.setAttribute('aria-pressed',cmp.includes(b.dataset.id)));
  const rs=cmp.map(id=>RES.find(r=>r.id===id));
  const row=(lab,f,g)=>`<tr><th>${g?tip(g,lab):lab}</th>${rs.map(r=>`<td>${f(r)}</td>`).join('')}</tr>`;
  const mx=Math.max(...rs.map(r=>r.imp?r.imp.v:0));
  $('#cmpOut').innerHTML=`<div class="tblwrap"><table><thead><tr><th></th>${rs.map(r=>`<th><span class="badge b-sc" style="margin-bottom:4px">${CATN[r.cat]}</span><br>${r.n}</th>`).join('')}</tr></thead><tbody>
   ${row('¿Renovable?',r=>r.ren,'renovable')}${row('¿Limpia?',r=>r.lim,'limpia')}${row('Combustible',r=>r.comb,'combustible')}${row('Conversión',r=>r.conv,'conversion')}${row('Tecnología',r=>r.tec,'tecnologia')}${row('Disponibilidad',r=>r.disp,'intermitencia')}
   ${row('Emisiones directas',r=>r.dir,'directas')}${row('Emisiones de ciclo de vida',r=>'<i>No cuantificadas en los documentos cargados.</i> Se necesita una fuente externa que proporciones.','ciclovida')}
   ${row('Importancia en CFE, 2024',r=>r.imp?`<div class="brow" style="grid-template-columns:1fr"><div class="bt"><div class="bf c-${r.cat}" style="width:${Math.max(1,100*r.imp.v/mx)}%"></div></div><div>${fmt(r.imp.v)} GWh · ${pct(r.imp.v,TOT.b)}</div><div class="note">${esc(r.imp.k)}${r.imp.note?'. '+esc(r.imp.note):''}</div></div>`:'<span class="note">Sin generación en la tabla de CFE. El informe reporta 300 MW de bioenergía en Contratos Legados (PDF p. 75).</span>')}
   </tbody></table></div>
   <div class="row" style="margin-top:8px">${bd('of')}${bd('co')}<span class="src">La generación asociada es la de la tecnología principal: una tecnología puede usar más de un combustible, así que no es la generación del combustible. Dato de CO₂ de CFE: ${tip('co2','0.6 tCO₂/MWh en 2022-2024')}, promedio de todo su parque.</span></div>`;
}

/* ========== conciencia ========== */
function sec6(){
  const f24=shares({F:catGen('F','b'),N:catGen('N','b'),R:catGen('R','b')}),f23=shares({F:catGen('F','a'),N:catGen('N','a'),R:catGen('R','a')});
  const cS=shares({F:capCat('F'),N:capCat('N'),R:capCat('R')});
  const uses=GEN.filter(x=>x.c2).map(x=>({k:x.k,g:x.g,cat:x.cat,b:useIdx(x)*100,txt:fmt(useIdx(x)*100,0)+' %',tip:x.k+': índice aproximado de uso de la capacidad en 2024.'}));
  const dv=GEN.filter(x=>x.cat!=='x').map(x=>({k:x.k,cat:x.cat,b:Math.abs(x.v),txt:(x.v>0?'+':'−')+fmt(Math.abs(x.v),1)+' %',tip:`${x.k}: ${x.v>0?'+':''}${x.v} % entre 2023 y 2024`}));
  const rs=GEN.filter(x=>x.cat==='R'),rsT=sum(rs,x=>x.b);
  $('#p-conciencia').innerHTML=`<div><h2>Indicadores de conciencia energética</h2><p class="lead">Cinco indicadores calculados con datos de CFE. Cada uno termina con una pregunta para reflexionar.</p></div>
  <div class="grid g2">
   <div class="card"><h3>1 · Dependencia de combustibles fósiles</h3><div class="row">${bd('ca')}${SCOPE.cfe}</div>
     <div class="kpi"><b>${fmt(f24.F,1)} %</b><span>de la generación bruta de CFE en 2024 fue fósil (2023: ${fmt(f23.F,1)} %). En capacidad: ${fmt(cS.F,1)} %.</span></div>
     <div class="kpi"><b>${fmt(100*782478/FOSSTJ,0)} %</b><span>de la energía de combustibles fósiles de CFE es gas natural</span></div>
     <div class="callout">Con CFE + PIE el fósil llega a 84 %. ¿Qué pasaría con el costo si un solo combustible concentra la mayor parte?</div></div>
   <div class="card"><h3>2 · Participación de recursos renovables</h3><div class="row">${bd('ca')}${SCOPE.cfe}</div>
     <div class="kpi"><b>${fmt(f24.R,1)} %</b><span>de la generación de CFE en 2024 (2023: ${fmt(f23.R,1)} %). En capacidad: ${fmt(cS.R,1)} %.</span></div>
     <div class="kpi"><b>${fmt(100*22354/rsT,0)} %</b><span>de la generación renovable de CFE es hidráulica</span></div>
     <div class="callout">La capacidad renovable pesa más que su generación. ¿Qué factores explican esa diferencia?</div></div>
   <div class="card"><h3>3 · Participación de la energía nuclear</h3><div class="row">${bd('ca')}${SCOPE.cfe}</div>
     <div class="kpi"><b>${fmt(f24.N,1)} %</b><span>de la generación con solo ${fmt(cS.N,1)} % de la capacidad de CFE</span></div>
     <div class="callout">Una sola central genera casi una décima parte. ¿Qué ventajas y riesgos tiene depender de pocas instalaciones grandes?</div></div>
   <div class="card"><h3>4 · Evolución de las tecnologías 2023 → 2024</h3><div class="row">${bd('of')}${SCOPE.cfe}</div>
     <div>${bars(dv,110)}</div><div class="src">Magnitud del cambio. Signo en la etiqueta (+ sube, − baja). Fuente: ${D24}, PDF p. 29.</div>
     <div class="callout">La solar creció +102.6 %, pero ¿cuántos GWh aportó realmente frente a la hidráulica?</div></div>
   <div class="card" style="grid-column:1/-1"><h3>Uso de la capacidad por tecnología, 2024</h3><div class="row">${bd('ca')}${SCOPE.cfe}${tip('factor','<span class="badge b-co">¿Cómo se calcula?</span>')}</div>
     <div>${bars(uses,100)}</div>${legend()}
     <div class="src">Índice = generación bruta ÷ (capacidad efectiva promedio 2023-2024 × ${fmt(HRS24)} h). La solar se calculó con promedio porque pasó de 126 a 433 MW. Aproximación, no el factor de planta oficial (CFE total: 38.5 %).</div></div>
   <div class="card" style="grid-column:1/-1"><h3>5 · Implicaciones de usar recursos renovables y no renovables</h3><div class="row">${bd('of')}${bd('si')}${SCOPE.cfe}</div>
     <div class="grid g3">
      <div class="callout"><b>No renovables:</b> el costo variable depende del combustible. Según el informe, los combustibles son 58 % de los costos totales de CFE (PDF p. 195). En 2024 CFE gastó 25 791 millones de pesos en gas natural.</div>
      <div class="callout"><b>Renovables:</b> sin combustible, pero dependen del recurso. La hidráulica creció +14.2 % entre 2023 y 2024; ese tipo de variación se debe a la hidrología, no a una decisión de despacho.</div>
      <div class="callout"><b>Reflexiona:</b> ¿qué conviene a un sistema: menor costo de combustible, o un recurso que no siempre está disponible cuando se necesita?</div></div>
     <div><label for="gasSl"><b>Simulador:</b> variación del precio del gas natural: <b id="gasVal">+0 %</b></label>
      <input id="gasSl" type="range" min="-30" max="50" step="5" value="0"></div>
     <div class="grid g2"><div class="kpi"><b id="gasCost">${fmt(25791)}</b><span>millones de pesos: gasto de CFE en gas (2024 real con 0 %)</span></div>
      <div class="kpi"><b id="gasDelta">+0</b><span>millones de pesos de diferencia (volumen y otros costos constantes)</span></div></div>
     <div class="src">Simulación lineal: costo × (1 + variación). No incluye cambios de despacho, cobertura ni efecto en los PIE. Dato base: ${D24}, PDF p. 195.</div></div>
  </div>`;
  $('#gasSl').oninput=e=>{const v=+e.target.value;$('#gasVal').textContent=(v>=0?'+':'−')+Math.abs(v)+' %';$('#gasCost').textContent=fmt(25791*(1+v/100),0);const d=25791*v/100;$('#gasDelta').textContent=(d>=0?'+':'−')+fmt(Math.abs(d),0)};
}

/* ========== reflexión ========== */
function qChart(i){
  const f24=shares({F:catGen('F','b'),N:catGen('N','b'),R:catGen('R','b')}),cS=shares({F:capCat('F'),N:capCat('N'),R:capCat('R')});
  if(i===0)return legend()+`<div class="src">Capacidad efectiva 2024</div>${stack({...cS,u:'MW'},'Capacidad')}<div class="src">Generación bruta 2024</div>${stack({...f24,u:'GWh'},'Generación')}`;
  if(i===1)return bars(FUEL.map(f=>({k:f.k,cat:f.cat,b:f.b,txt:fmt(f.b)+' TJ'})),Math.max(...FUEL.map(f=>f.b)));
  if(i===2)return bars(['Solar fotovoltaica','Hidroeléctrica'].map(n=>{const x=GEN.find(g=>g.k===n);return{k:n,cat:x.cat,b:Math.abs(x.b-x.a),txt:`+${fmt(x.b-x.a)} GWh (${x.v>0?'+':''}${fmt(x.v,1)} %)`}}),3000);
  if(i===3)return `<div class="stack"><div class="seg c-F" style="flex:148.8">CFE 148.8 TWh</div><div class="seg c-R" style="flex:103.6">PIE 103.6 TWh</div></div><div class="src">Fósil: CFE 74 %, PIE 98.5 %, conjunto 84 %.</div>`;
  return '';
}
const QS=[
 {q:'En la gráfica, la nuclear tiene una porción pequeña de la capacidad pero mayor de la generación. ¿Qué indica?',o:['Genera electricidad más barata que las demás tecnologías.','Opera más horas cerca de su capacidad que el promedio del parque.','Los datos son inconsistentes y no se pueden usar.','Las renovables operan más tiempo que la nuclear.'],a:1,
  e:['No: la gráfica no trae costos. Relacionar generación con capacidad habla de uso de la central, no de precio.','Correcto. Generación ÷ capacidad es mayor que en el promedio; calculamos ≈87 % para la nuclear frente a 38.5 % del parque de CFE.','No: capacidad y generación miden cosas distintas (MW frente a GWh); que difieran es normal.','Es al revés: las renovables tienen más peso en capacidad que en generación.']},
 {q:'El gas natural es la mayor parte de la energía que consume CFE en combustibles fósiles. ¿Qué implicación se desprende?',o:['Que todos los fósiles tienen el mismo riesgo de precio.','Que un cambio en el precio o suministro del gas afecta sobre todo los costos de CFE.','Que al subir el gas, el combustóleo baja de precio.','Que no afecta, porque CFE también usa uranio.'],a:1,
  e:['No: cada combustible tiene su propio mercado.','Correcto. Cuando un combustible concentra el consumo, el costo es sensible a su mercado. El simulador de la sección anterior lo muestra.','No se deduce de los datos; los precios pueden moverse juntos o no.','El uranio es una parte menor y no sustituye al gas en las centrales que lo usan.']},
 {q:'La solar fotovoltaica creció +102.6 % y la hidráulica +14.2 %. ¿Qué conclusión es correcta?',o:['La solar aportó más energía nueva que la hidráulica.','El porcentaje de la solar es alto porque partía de una base pequeña; en GWh el aumento hidráulico fue mayor.','La hidráulica ya no es importante.','Los porcentajes no se pueden comparar con nada.'],a:1,
  e:['No: +281 GWh frente a +2 786 GWh.','Correcto: un porcentaje alto sobre una base pequeña pesa poco en términos absolutos.','No: sigue siendo la principal fuente limpia de CFE (22 354 GWh).','Se pueden comparar, pero conviene mirar también el valor absoluto.']},
 {q:'Un estudiante dice: «El 84 % de la electricidad de México es fósil». ¿Qué es lo más preciso?',o:['Es correcto: es el dato nacional.','Es el dato de CFE + PIE; no es el total nacional y no incluye a otros generadores.','Es solo de CFE.','Se puede usar el dato de 2022 para validarlo.'],a:1,
  e:['No: el informe lo presenta para CFE y los PIE.','Correcto. El alcance importa: CFE tiene 74 % fósil, los PIE casi 100 % y el conjunto 84 %. El total nacional requiere otra fuente.','No: CFE sola es 74 %.','No: 2022 no está calculado con la misma base.']},
 {q:'Según las definiciones cargadas, ¿qué afirmación sobre la energía nuclear es correcta?',o:['Es renovable porque no emite CO₂.','Es limpia según la Ley del Sector Eléctrico, pero no aparece entre las fuentes renovables de la LPTE.','No es ni renovable ni limpia.','Es renovable y no limpia.'],a:1,
  e:['No: renovable se define por regenerarse a escala humana, no por sus emisiones.','Correcto: son dos criterios distintos en dos leyes.','No: la lista de la LSE incluye explícitamente la energía nucleoeléctrica.','No: es lo contrario.']}
];
let qs={a:{}};
function sec7(){
  $('#p-reflexion').innerHTML=`<div><h2>Actividad de reflexión</h2><p class="lead">Cinco preguntas que piden interpretar una gráfica o comparar recursos. Al responder verás por qué cada opción es correcta o no.</p></div>
  <div class="grid g2" id="qs"></div><div class="card" id="qres" aria-live="polite"><b>Resultado</b><span class="note">Responde todas las preguntas para ver tu resultado.</span></div>`;
  QS.forEach((q,i)=>{const d=document.createElement('div');d.className='card';
    d.innerHTML=`<span class="qn">Pregunta ${i+1} de ${QS.length}</span><div>${qChart(i)}</div><b>${esc(q.q)}</b><div class="opts"></div><div class="feedback" hidden></div>`;
    const o=$('.opts',d);q.o.forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>ans(i,j,d);o.append(b)});$('#qs').append(d)});
}
function ans(i,j,d){
  const q=QS[i];qs.a[i]=j;
  $$('.opt',d).forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('right');else if(k===j)b.classList.add('wrong');if(k===j)b.classList.add('sel')});
  const fb=$('.feedback',d);fb.hidden=false;fb.className='feedback'+(j===q.a?'':' bad');
  fb.innerHTML=`<b>${j===q.a?'✓ Correcto':'✕ No es esa'}</b><br>${esc(q.e[j])}${j!==q.a?`<br><b>Respuesta correcta:</b> ${esc(q.e[q.a])}`:''}`;
  if(Object.keys(qs.a).length===QS.length){const n=QS.filter((x,k)=>qs.a[k]===x.a).length;$('#qres').innerHTML=`<b>Resultado: ${n} de ${QS.length}</b><span class="note">${n===QS.length?'Interpretaste bien alcance, unidades y definiciones.':'Revisa las preguntas marcadas y compara su alcance (CFE, CFE + PIE, nacional) y las unidades (MW frente a GWh).'}</span><button class="btn" id="qRe">Reiniciar</button>`;$('#qRe').onclick=()=>{qs={a:{}};sec7()}}
}

/* ========== pie ========== */
function foot(){
  $('#main').insertAdjacentHTML('beforeend',`<footer>
   <details><summary>Fuentes y límites de los datos</summary><ul>
    <li><b>${D24}</b> (versión 7-jul-2025): generación por tecnología y consumo de combustibles (PDF p. 29, pág. 26), capacidad (p. 24), indicadores (p. 31), CFE + PIE (p. 195).</li>
    <li><b>PRODESEN 2023-2037, Cap. 4:</b> capacidad nacional 2022 y planeación al 2037 (PDF p. 4 y 6).</li>
    <li><b>DOF 18-mar-2025:</b> definiciones de energías limpias (Ley del Sector Eléctrico, extracto p. 3) y de renovables y fósiles (Ley de Planeación y Transición Energética, decreto completo p. 192).</li>
    <li><b>Corrección:</b> el Informe 2022 (p. 35) reporta 35.1 TWh hidráulicos y 36 % de energía limpia en 2022. La suma por central de las tablas de ambos informes (33.8 TWh netos en 2022) lo respalda, y explica la caída posterior. La serie por tecnología de 2022 simplemente no está publicada en la misma tabla que 2023-2024.</li>
    <li><b>Inconsistencia 1:</b> «Agua turbinada» (100 594 miles de m³, PDF p. 29) es demasiado bajo para producir 22 354 GWh (solo la EPS CFE Generación I reporta 29 030 Mm³ en 2024, p. 32); se sospecha un error de unidad y no se usa.</li>
    <li><b>Inconsistencia 2:</b> el Informe 2024 (p. 195) dice que el 16 % no fósil de CFE + PIE es «energía eólica», pero incluye nuclear, hidráulica y geotermia de CFE.</li>
    <li><b>Pendientes:</b> emisiones de ciclo de vida por tecnología, generación nacional por tecnología y el potencial de recursos (irradiación, viento) requieren fuentes oficiales externas; no se usaron valores no documentados.</li>
    <li><b>Marca:</b> los colores se muestrearon del kit Ultravioleta v1.0 (#32095F, #4B1C8F, #8E4DF2, #E4CCFF); el logotipo es un recorte provisional del kit en baja resolución, a sustituir por el SVG original.</li></ul></details>
  </footer>`);
}

const TABS=[['clasificacion','1 · Clasificación',sec1],['clasificador','2 · Clasificador',sec2],['conversion','3 · Conversión',sec3],['matriz','4 · Matriz energética',sec4],['comparador','5 · Comparador',sec5],['conciencia','6 · Indicadores',sec6],['reflexion','7 · Reflexión',sec7]];
const tl=$('#tablist');tl.setAttribute('role','tablist');
TABS.forEach(([id,n,fn])=>{
  const b=document.createElement('button');b.className='tab';b.id='t-'+id;b.setAttribute('role','tab');b.setAttribute('aria-controls','p-'+id);b.textContent=n;b.onclick=()=>go(id);tl.append(b);
  const s=document.createElement('section');s.className='panel';s.id='p-'+id;s.setAttribute('role','tabpanel');s.setAttribute('aria-labelledby','t-'+id);s.hidden=true;$('#main').append(s);fn();
});
foot();
function go(id,fromHash){
  if(!TABS.some(t=>t[0]===id))id='clasificacion';
  TABS.forEach(([t])=>{$('#p-'+t).hidden=t!==id;const b=$('#t-'+t);b.setAttribute('aria-selected',t===id);b.tabIndex=t===id?0:-1});
  hideTip();if(!fromHash){try{history.replaceState(null,'','#'+id)}catch(e){}}
  $('#t-'+id).scrollIntoView({block:'nearest',inline:'center'});
}
tl.addEventListener('keydown',e=>{const i=TABS.findIndex(t=>$('#t-'+t[0]).getAttribute('aria-selected')==='true');
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const j=(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length;go(TABS[j][0]);$('#t-'+TABS[j][0]).focus()}});
addEventListener('hashchange',()=>go(location.hash.slice(1),true));
go(location.hash.slice(1)||'clasificacion',true);
</script>
