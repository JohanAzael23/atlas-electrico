<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablero de Centrales CFE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

/* Concepto: tablero de estudio con barra de módulos arriba, pestañas de sección fijas y paneles de gráfica + detalle.
   Identidad: solo los 4 tonos del kit Ultravioleta v1.0 (valores muestreados del kit, validar contra HEX oficial). Arial Bold / Regular. */
:root{
  --pn:#32095F; --vr:#4B1C8F; --uv:#8E4DF2; --ls:#E4CCFF;
  --bg:#F4F0FB; --surface:#FFFFFF; --surface2:#EFE6FC; --ink:#1F0645; --ink2:#4B1C8F;
  --muted:color-mix(in srgb,var(--ink) 68%,var(--surface)); --line:color-mix(in srgb,var(--ink) 16%,var(--surface));
  --c-F:#32095F; --c-N:#E4CCFF; --c-Nline:#4B1C8F; --c-R:#8E4DF2;
  --accent:#8E4DF2; --on-accent:#FFFFFF; --hd:#32095F; --on-hd:#FFFFFF; --focus:#8E4DF2;
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1F0645; --surface:#32095F; --surface2:color-mix(in srgb,#4B1C8F 55%,#32095F); --ink:#F4F0FB; --ink2:#E4CCFF;
  --c-F:#E4CCFF; --c-N:#4B1C8F; --c-Nline:#E4CCFF; --c-R:#8E4DF2; --hd:#1F0645; --focus:#E4CCFF; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1F0645; --surface:#32095F; --surface2:color-mix(in srgb,#4B1C8F 55%,#32095F); --ink:#F4F0FB; --ink2:#E4CCFF;
  --c-F:#E4CCFF; --c-N:#4B1C8F; --c-Nline:#E4CCFF; --c-R:#8E4DF2; --hd:#1F0645; --focus:#E4CCFF; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hd)}
h1,h2,h3,h4{font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:22px}h3{font-size:17px}h4{font-size:14px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto}
.band{margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--hd);color:var(--on-hd);padding-block:14px 12px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.logo{height:40px;width:auto;border-radius:6px;background:#fff;padding:2px 6px;display:block}
.ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.ttl b{font-size:18px}.ttl span{font-size:12px;opacity:.85}
.mods{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.mod{border:1px solid color-mix(in srgb,#fff 35%,transparent);background:transparent;color:var(--on-hd);padding:6px 12px;border-radius:999px;font-size:13px}
.mod[aria-current="page"]{background:var(--ls);color:var(--pn);border-color:var(--ls);font-weight:700}
.mod[disabled]{opacity:.6;cursor:not-allowed}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.tabs [role=tablist]{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;max-width:1180px;margin:0 auto}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--vr);color:#fff;border-color:var(--vr);font-weight:700}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:var(--uv)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{background:var(--uv)}}
main{padding-top:20px;display:flex;flex-direction:column;gap:20px}
section.panel{display:flex;flex-direction:column;gap:16px}
.lead{color:var(--muted);max-width:75ch}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.alt{background:var(--surface2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:1;padding:4px 7px;border-radius:5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.b-of{background:var(--pn);color:#fff;border:1px solid var(--pn)}
:root[data-theme="dark"] .b-of{background:var(--ls);color:var(--pn);border-color:var(--ls)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b-of{background:var(--ls);color:var(--pn);border-color:var(--ls)}}
.b-ca{border:1.5px solid var(--ink2);color:var(--ink2)}
.b-si{border:1.5px dashed var(--ink2);color:var(--ink2)}
.b-es{border:1.5px dotted var(--ink2);color:var(--ink2)}
.b-co{background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.b-sc{background:var(--ls);color:var(--pn)}
.tip{border-bottom:1.5px dotted var(--ink2);cursor:help;text-decoration:none}
.tip:focus-visible{outline-offset:1px}
#tooltip{position:fixed;z-index:60;max-width:min(340px,calc(100vw - 24px));background:var(--pn);color:#fff;border:1px solid var(--ls);
  padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.45;box-shadow:0 6px 20px rgba(31,6,69,.35);pointer-events:none}
#tooltip .tt-t{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ls);margin-bottom:4px;font-weight:700}
#tooltip .tt-s{margin-top:6px;font-size:11px;color:var(--ls)}
.chain{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;position:relative;min-width:0;display:flex;flex-direction:column;gap:4px}
.step small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.step b{font-size:15px}
.step:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--ink2);font-weight:700;z-index:2;background:var(--bg);border-radius:50%;width:16px;text-align:center;line-height:16px}
@media (max-width:720px){.chain{grid-template-columns:1fr}.step:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-12px;transform:translateX(-50%)}}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.pill[aria-pressed="true"],.pill[aria-selected="true"]{background:var(--vr);color:#fff;border-color:var(--vr);font-weight:700}
:root[data-theme="dark"] .pill[aria-pressed="true"]{background:var(--uv)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill[aria-pressed="true"]{background:var(--uv)}}
.fam{border-top:5px solid var(--c-F)}.fam.N{border-top-color:var(--c-Nline)}.fam.R{border-top-color:var(--c-R)}
.chip{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px;margin:0 4px 4px 0}
button.chip{cursor:pointer}button.chip[aria-pressed="true"]{background:var(--vr);color:#fff;border-color:var(--vr)}
.note{font-size:13px;color:var(--muted)}
.callout{border-left:4px solid var(--uv);background:var(--surface2);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
.sets{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;align-items:stretch}
.set{border:2px solid var(--ink2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.set.inner{border-style:dashed;background:var(--surface2)}
.set h4{font-size:13px}
@media (max-width:640px){.sets{grid-template-columns:1fr}}
/* barras */
.brow{display:grid;grid-template-columns:minmax(96px,150px) 1fr minmax(70px,auto);gap:8px;align-items:center;padding:3px 0;border-radius:6px}
.brow:hover,.brow:focus-visible{background:var(--surface2)}
.bl{font-size:13px;min-width:0}
.bt{height:12px;background:color-mix(in srgb,var(--ink) 8%,var(--surface));border-radius:0 4px 4px 0;position:relative}
.bt.two{height:22px;background:none;display:flex;flex-direction:column;gap:2px}
.bf{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.two .bf{height:10px}
.two .bf.prev{opacity:.45}
.bv{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.c-F{background:var(--c-F)}.c-R{background:var(--c-R)}
.c-N{background:repeating-linear-gradient(45deg,var(--c-N) 0 4px,color-mix(in srgb,var(--c-Nline) 55%,var(--c-N)) 4px 6px);box-shadow:inset 0 0 0 1.5px var(--c-Nline)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.stack{display:flex;height:34px;gap:2px;border-radius:6px;overflow:hidden}
.seg{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;min-width:0;overflow:hidden;color:#fff}
.seg.c-F{color:var(--surface)}.seg.c-N{color:var(--ink)}
:root:not([data-theme="dark"]) .seg.c-F{color:#fff}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:30px;font-variant-numeric:tabular-nums;color:var(--ink2);line-height:1.05}
.kpi span{font-size:12px;color:var(--muted)}
/* clasificador */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:10px;border:1px dashed var(--ink2);border-radius:10px}
.kc{border:1.5px solid var(--ink2);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;cursor:grab;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left}
.kc small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kc[aria-pressed="true"]{background:var(--vr);color:#fff;border-color:var(--vr)}
.kc[aria-pressed="true"] small{color:var(--ls)}
.kc.ok{cursor:default;background:var(--surface2)}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.zone{border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:150px;background:var(--surface)}
.zone.over{border-color:var(--uv);background:var(--surface2)}
.zone .place{align-self:flex-start;border:1.5px solid var(--ink2);background:transparent;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:700}
.zone .place:disabled{opacity:.4;cursor:not-allowed}
.zl{display:flex;flex-wrap:wrap;gap:6px}
.feedback{border:1.5px solid var(--ink2);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--surface2);min-height:48px}
.feedback.bad{border-style:dashed}
.score{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.score b{font-size:20px;font-variant-numeric:tabular-nums}
.btn{border:1.5px solid var(--ink2);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:700;font-size:13px}
.btn.pri{background:var(--vr);border-color:var(--vr);color:#fff}
:root[data-theme="dark"] .btn.pri{background:var(--uv);border-color:var(--uv)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{background:var(--uv);border-color:var(--uv)}}
/* conversión */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:0}
.node{flex:1 1 130px;min-width:0;border:1.5px solid var(--ink2);background:var(--surface);border-radius:10px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:3px;position:relative}
.node small{font-size:11px;color:var(--muted)}
.node[aria-pressed="true"]{background:var(--vr);color:#fff;border-color:var(--vr)}
.node[aria-pressed="true"] small{color:var(--ls)}
.arrow{flex:0 0 28px;display:flex;align-items:center;justify-content:center;position:relative;color:var(--ink2);font-weight:700}
.arrow::before{content:"";position:absolute;left:2px;right:2px;top:50%;height:2px;background:repeating-linear-gradient(90deg,var(--uv) 0 6px,transparent 6px 10px);background-size:20px 2px;animation:dash 1s linear infinite}
.arrow::after{content:"▶";font-size:10px;position:absolute;right:0;top:50%;transform:translateY(-50%)}
@keyframes dash{to{background-position:20px 0}}
@media (max-width:720px){.flow{flex-direction:column}.arrow{flex:0 0 26px;height:26px}.arrow::before{left:50%;right:auto;top:2px;bottom:2px;width:2px;height:auto;background:repeating-linear-gradient(180deg,var(--uv) 0 6px,transparent 6px 10px);background-size:2px 20px;animation:dashv 1s linear infinite}.arrow::after{content:"▼";right:auto;left:50%;top:auto;bottom:0;transform:translateX(-50%)}}
@keyframes dashv{to{background-position:0 20px}}
@media (prefers-reduced-motion:reduce){.arrow::before{animation:none}}
.ener{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
/* comparador */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-weight:700;background:var(--surface2)}
tbody th{width:150px;background:var(--surface)}
tr:last-child td,tr:last-child th{border-bottom:0}
/* quiz */
.opts{display:flex;flex-direction:column;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;text-align:left;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--uv)}
.opt.sel{border-color:var(--ink2);border-width:2px}
.opt.right{border-color:var(--uv);background:var(--surface2);border-width:2.5px}
.opt.wrong{border-style:dashed;border-width:2px}
.opt:disabled{cursor:default}
.qn{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
input[type=range]{width:100%;accent-color:var(--uv)}
.src{font-size:12px;color:var(--muted)}
.src b{color:var(--ink)}
footer{margin-top:10px;display:flex;flex-direction:column;gap:12px}
details{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 14px}
summary{cursor:pointer;font-weight:700}
details ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px}

/* ===== añadidos del tablero de centrales ===== */
.filters{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fgrp{display:flex;flex-direction:column;gap:4px}
.fgrp label,.fgrp .fl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--ink2);border-radius:8px;padding:7px 10px;max-width:100%}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.brow.btn-row{cursor:pointer;width:100%;background:none;border:0;text-align:left;padding:4px 6px;border-radius:6px;font:inherit;color:inherit}
.brow.btn-row[aria-pressed="true"]{background:var(--surface2);outline:2px solid var(--uv)}
.dim{opacity:.3}
.dt{height:14px;position:relative;background:color-mix(in srgb,var(--ink) 8%,var(--surface));border-radius:4px}
.dz{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink2)}
.db{position:absolute;top:2px;bottom:2px;border-radius:3px}
.ycols{display:flex;gap:14px;align-items:flex-end;height:150px;padding:4px 0}
.ycol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.ycol .yb{width:100%;max-width:70px;border-radius:5px 5px 0 0;background:var(--c-R)}
.ycol .yb.nodata{background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--ink2) 35%,transparent) 5px 7px);border:1.5px dashed var(--ink2);height:44px!important}
.ycol b{font-size:13px;font-variant-numeric:tabular-nums;text-align:center}
.ycol span{font-size:12px;color:var(--muted)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pend{border:1.5px dashed var(--ink2);border-radius:8px;padding:6px 10px;font-size:13px;background:var(--surface2)}
.mapph{border:2px dashed var(--ink2);border-radius:12px;padding:16px;background:repeating-linear-gradient(135deg,transparent 0 12px,color-mix(in srgb,var(--ink2) 8%,transparent) 12px 14px)}
.b-ext{background:transparent;color:var(--ink);border:1.5px dashed var(--ink2)}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--ink) 4%,var(--surface));overflow:hidden}
.mapsvg{display:block;width:100%;height:auto}
.mapsvg .st{fill:var(--surface2);stroke:var(--ink2);stroke-width:.8;stroke-opacity:.55;vector-effect:non-scaling-stroke}
.mapsvg .st.has{fill:color-mix(in srgb,var(--c-R) 16%,var(--surface2))}
.mapsvg .pt{cursor:pointer;outline:none}
.mapsvg .pt .shp{stroke:var(--surface);stroke-width:1.6;vector-effect:non-scaling-stroke}
.mapsvg .pt.off{opacity:.12;pointer-events:none}
.mapsvg .pt.nod{opacity:.4}
.mapsvg .pt:hover .shp,.mapsvg .pt:focus-visible .shp{stroke:var(--focus);stroke-width:3}
.mapsvg .pt.sel .shp{stroke:var(--focus);stroke-width:3.5}
.mapsvg .pt.sel .halo{fill:none;stroke:var(--focus);stroke-width:2;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.mk{display:inline-block;vertical-align:-3px;margin-right:4px}
.mk svg{display:block}
@media (max-width:900px){.mapsplit{grid-template-columns:1fr!important}}
.empty{border:1.5px dashed var(--ink2);border-radius:10px;padding:14px;background:var(--surface2)}
.tbls{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:420px;overflow-y:auto}
.tbls table{min-width:720px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg.c-F,.seg.c-R{color:#fff}
:root[data-theme="dark"] .seg.c-F{color:var(--pn)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg.c-F{color:var(--pn)}}
.seg.clean{background:var(--c-R);color:#fff}
.seg.fos{background:var(--c-F);color:#fff}
:root[data-theme="dark"] .seg.fos{color:var(--pn)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg.fos{color:var(--pn)}}
.seg.est{background:repeating-linear-gradient(135deg,var(--surface2) 0 6px,color-mix(in srgb,var(--ink2) 30%,var(--surface2)) 6px 8px);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink2)}
.seg.hl{outline:3px solid var(--ls);outline-offset:-3px}
.cyc{display:flex;flex-wrap:wrap;gap:6px}
</style>
</head>
<body>

<header class="band"><div class="wrap">

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(n,d=0)=>Number(n).toLocaleString('es-MX',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(n,d=1)=>(n>0?'+':n<0?'−':'')+fmt(Math.abs(n),d);
const say=t=>{$('#live').textContent=t};
const D24='Informe Anual 2024 CFE', D22='Informe Anual 2022 CFE';
const GPPD='<a href="https://github.com/wri/global-power-plant-database" target="_blank" rel="noopener">Global Power Plant Database (WRI), CC BY 4.0</a>';
const EXT='<span class="badge b-ext" data-t="Fuente externa: no proviene de los documentos cargados. Se usa solo para ubicar la central y su capacidad instalada; la generación (GWh) siempre viene de los informes de CFE.">Fuente externa</span>';
const TYPES={of:['Oficial','b-of'],ca:['Cálculo','b-ca'],si:['Simulación','b-si'],es:['Estimación','b-es'],co:['Concepto','b-co']};
const bd=(t,x)=>`<span class="badge ${TYPES[t][1]}" data-t="${esc(x||({of:'Dato publicado en un documento oficial cargado.',ca:'Operación aritmética sobre datos oficiales.',si:'Resultado de un modelo con supuestos editables.',es:'Valor inferido con supuestos; no es un dato publicado.',co:'Explicación técnica de apoyo; no es un dato.'})[t])}" tabindex="0">${TYPES[t][0]}</span>`;
const sc=(s,t)=>`<span class="badge b-sc" data-t="${esc(t)}" tabindex="0">${s}</span>`;
const SCOPE={cfe:sc('CFE','Datos exclusivos de la Comisión Federal de Electricidad, sin Productores Independientes de Energía (PIE).'),
 pie:sc('CFE + PIE','CFE más los Productores Independientes de Energía. No es el total nacional.'),
 sen:sc('Nacional (SEN)','Sistema Eléctrico Nacional: todas las centrales interconectadas.'),
 est:sc('Nacional estimado','Total nacional calculado a partir de la participación publicada de CFE. No es un dato publicado.'),
 eps:sc('Por EPS','Datos de una Empresa Productiva Subsidiaria de CFE, no del total de CFE.')};

/* ===== glosario ===== */
const G={
 rankine:{t:'Ciclo termodinámico',x:'Ciclo Rankine: una bomba eleva la presión del agua, una caldera la convierte en vapor, el vapor se expande en una turbina (donde se obtiene la potencia) y un condensador lo regresa a agua. Es la base de las centrales de vapor: carboeléctricas, vapor convencional, nucleoeléctricas y la parte de vapor de un ciclo combinado.'},
 brayton:{t:'Ciclo termodinámico',x:'Ciclo Brayton: un compresor eleva la presión del aire, se quema combustible en una cámara de combustión y los gases calientes se expanden en una turbina de gas. Es el ciclo del turbogás y de la parte de gas de un ciclo combinado.'},
 cc:{t:'Tecnología',x:'Ciclo combinado: une un ciclo Brayton (turbina de gas) con un ciclo Rankine (vapor). Los gases de escape de la turbina de gas, aún calientes, producen vapor en una caldera de recuperación que mueve una segunda turbina. Obtiene más electricidad del mismo combustible que cada ciclo por separado.'},
 vc:{t:'Tecnología',x:'Vapor convencional: una caldera quema combustible para producir vapor que mueve una turbina de vapor (ciclo Rankine). El Informe 2024 indica combustóleo como insumo principal y gas natural como otro insumo.',s:D24+', PDF p. 39 (CFE Generación II)'},
 hrsg:{t:'Equipo',x:'Caldera de recuperación de calor: toma el calor de los gases de escape de una turbina de gas y lo usa para producir vapor, sin quemar más combustible (o con poco).'},
 tg:{t:'Tecnología',x:'Turbogás: turbina de gas con generador, sin ciclo de vapor (ciclo Brayton). Opera con gas natural o con destilados como diésel según el diseño.'},
 ci:{t:'Tecnología',x:'Combustión interna: motores acoplados a un generador; en las tablas del informe aparecen como «Diésel».'},
 carbo:{t:'Tecnología',x:'Carboeléctrica: quema carbón en una caldera para producir vapor (ciclo Rankine). Las unidades duales también usan combustóleo.',s:D24+', PDF p. 39'},
 nuclear:{t:'Tecnología',x:'Nucleoeléctrica: el calor de la fisión del uranio produce vapor que mueve una turbina (ciclo Rankine). No hay combustión.'},
 hid:{t:'Tecnología',x:'Hidroeléctrica: el agua de un embalse o río mueve una turbina hidráulica acoplada a un generador. Su producción depende de la hidrología (lluvias y niveles de embalse).'},
 geo:{t:'Tecnología',x:'Geotermoeléctrica: usa vapor del subsuelo para mover una turbina; no hay combustión.'},
 eol:{t:'Tecnología',x:'Eoloeléctrica: el viento mueve las aspas de un aerogenerador acoplado a un generador.'},
 fv:{t:'Tecnología',x:'Solar fotovoltaica: celdas semiconductoras convierten la luz en corriente continua; un inversor la pasa a alterna.'},
 eps:{t:'Término',x:'EPS: Empresa Productiva Subsidiaria de CFE. Las centrales de generación de CFE están agrupadas en las EPS CFE Generación I a VI. En los informes cada EPS reporta sus propias centrales. El nombre de la EPS no indica la ubicación de la central.'},

/* ===== estado y filtros ===== */
const st={year:2024,tech:'all',eps:'all',sel:null,view:'chart',all:false,cyc:'cc',cycStep:0};
function drawFilters(){
 $('#filters').innerHTML=`<div class="fgrp"><span class="fl">Año</span><div class="pills" role="group" aria-label="Año">${[2022,2023,2024].map(y=>`<button class="pill" data-y="${y}" aria-pressed="${st.year===y}">${y}</button>`).join('')}</div></div>
 <div class="fgrp"><label for="fTech">Tecnología</label><select id="fTech"><option value="all">Todas</option><optgroup label="Fósiles">${GEN.filter(x=>x.cat==='F').map(x=>`<option>${x.k}</option>`).join('')}</optgroup><optgroup label="Nuclear"><option>Nucleoeléctrica</option></optgroup><optgroup label="Renovables">${GEN.filter(x=>x.cat==='R').map(x=>`<option>${x.k}</option>`).join('')}</optgroup></select></div>
 <div class="fgrp"><label for="fEps">Entidad CFE (para Centrales)</label><select id="fEps"><option value="all">Todas</option>${Object.entries(EPSN).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
 <div class="note" style="max-width:34ch">Cada sección indica si usa un filtro. 2023 no se publica por central.</div>`;
 $('#fTech').value=st.tech;$('#fEps').value=st.eps;
 $$('#filters [data-y]').forEach(b=>b.onclick=()=>{st.year=+b.dataset.y;drawFilters();renderAll()});
 $('#fTech').onchange=e=>{st.tech=e.target.value;renderAll()};$('#fEps').onchange=e=>{st.eps=e.target.value;renderAll()};
}

/* ===== componentes ===== */
function bars(rows,max){return rows.map(r=>`<div class="brow ${r.dim?'dim':''}" tabindex="0" data-t="${esc(r.tip||'')}"><div class="bl">${r.g?tip(r.g,esc(r.k)):esc(r.k)}</div><div class="bt ${r.b2!=null?'two':''}">${r.b2!=null?`<div class="bf prev c-${r.cat}" style="width:${100*r.b2/max}%"></div>`:''}<div class="bf c-${r.cat}" style="width:${Math.max(.6,100*r.b/max)}%"></div></div><div class="bv">${r.txt}</div></div>`).join('')}
function divbars(rows,max){return rows.map(r=>{const w=Math.min(50,50*Math.abs(r.v)/max);return `<div class="brow ${r.dim?'dim':''}" tabindex="0" data-t="${esc(r.tip||'')}"><div class="bl">${r.g?tip(r.g,esc(r.k)):esc(r.k)}</div><div class="dt"><div class="dz"></div><div class="db c-${r.cat}" style="${r.v<0?`right:50%`:`left:50%`};width:${w}%"></div></div><div class="bv">${sgn(r.v)} %</div></div>`}).join('')}
const legend=()=>`<div class="legend"><span><i class="sw c-F"></i>Fósil</span><span><i class="sw c-N"></i>Nuclear (rayado)</span><span><i class="sw c-R"></i>Renovable</span></div>`;
function stack(items){const t=items.reduce((s,i)=>s+i.v,0);return `<div class="stack">${items.map(i=>`<div class="seg ${i.cls}" style="flex:${i.v} 1 0" data-t="${esc(i.tip||i.l)}" tabindex="0">${100*i.v/t>=7?i.l:''}</div>`).join('')}</div>`}
const kpi=(b,s,u)=>`<div class="kpi"><span>${s}</span><b>${b}</b>${u?`<span>${u}</span>`:''}</div>`;

/* ===== PANORAMA ===== */
function pPanorama(){
 const y=st.year,tf=st.tech,prev=NET[y-1],vNet=prev?100*(NET[y]/prev-1):null,fos=100-LIM[y];
 const hl=x=>tf!=='all'&&x.k!==tf;
 let techBlock;
 if(y===2022){
  const rows=['Hidroeléctrica','Geotermoeléctrica','Solar fotovoltaica','Eoloeléctrica'].map(k=>({k,cat:'R',g:GEN.find(x=>x.k===k).g,b:sumP(p=>p.tech===k,2022),dim:tf!=='all'&&tf!==k}));
  rows.forEach(r=>{r.txt=fmt(r.b)+' GWh';r.tip=`${r.k}: ${fmt(r.b)} GWh netos en 2022 (suma de sus centrales).`});
  techBlock=`<div class="callout">En 2022 el informe no publica la generación por tecnología en una tabla. Aquí se muestran las renovables como suma de sus centrales (generación neta). Fósiles y nuclear: sin dato por tecnología.</div>${bars(rows,Math.max(...rows.map(r=>r.b)))}<div class="row" style="margin-top:6px">${bd('ca')}${SCOPE.cfe}<span class="src">Suma de tablas por central, ${D22} (PDF p. 50, 57, 71-72, 109).</span></div>`;
 }else{
  const rows=GEN.map(x=>({k:x.k,g:x.g,cat:x.cat,b:x[y===2024?'b':'a'],b2:y===2024?x.a:null,dim:hl(x),txt:fmt(x[y===2024?'b':'a'])+' GWh · '+fmt(100*x[y===2024?'b':'a']/TOTB[y],1)+' %',tip:`${x.k}: ${fmt(x[y===2024?'b':'a'])} GWh en ${y} (${fmt(100*x[y===2024?'b':'a']/TOTB[y],1)} % de ${fmt(TOTB[y])} GWh).`}));
  techBlock=legend()+(y===2024?'<div class="legend"><span>Barra clara: 2023</span><span>Barra fuerte: 2024</span></div>':'')+bars(rows,Math.max(...GEN.map(x=>x.b)))+`<div class="row" style="margin-top:6px">${bd('of')}${SCOPE.cfe}<span class="src">Generación bruta. ${D24}, PDF p. 29. El % es la participación en la generación bruta total de CFE (${fmt(TOTB[y])} GWh).</span></div>`;
 }
 let varBlock;
 if(y===2024){
  varBlock=divbars(GEN.map(x=>({k:x.k,g:x.g,cat:x.cat,v:x.v,dim:hl(x),tip:`${x.k}: ${sgn(x.v)} % entre 2023 y 2024.`})),110)+`<div class="src" style="margin-top:6px">Variación 2024 frente a 2023. ${D24}, PDF p. 29. Turbojet (+68.5 %) es una base muy pequeña (209 GWh).</div>`;
 }else if(y===2023){
  varBlock=`${kpi(sgn(vNet)+' %','Generación neta 2023 frente a 2022','')}<div class="callout">El informe no publica 2022 por tecnología, así que la variación por tecnología 2022 → 2023 no se puede calcular. Sí se puede por central (2022 → 2024) en la sección «Centrales».</div>`;
 }else{
  const rows=['Hidroeléctrica','Geotermoeléctrica','Solar fotovoltaica','Eoloeléctrica'].map(k=>{const a=sumP(p=>p.tech===k,2022),b=sumP(p=>p.tech===k,2024);return{k,cat:'R',g:GEN.find(x=>x.k===k).g,v:100*(b/a-1),dim:tf!=='all'&&tf!==k,tip:`${k}: ${fmt(a)} GWh (2022) y ${fmt(b)} GWh (2024). Incluye centrales que solo existen en 2024.`}});
  varBlock=`<div class="callout">Variación 2022 → 2024 de las renovables, como suma de sus centrales (neta). La solar incluye centrales nuevas.</div>`+divbars(rows,200)+`<div class="row" style="margin-top:6px">${bd('ca')}${SCOPE.cfe}</div>`;
 }
 let selCard='';
 if(tf!=='all'){const x=GEN.find(g=>g.k===tf);selCard=`<div class="card alt"><h3>${tip(x.g||'cc',x.k)} · seleccionada</h3><div class="grid g3">${kpi(fmt(x.a),'GWh 2023 (bruta)','')}${kpi(fmt(x.b),'GWh 2024 (bruta)','')}${kpi(sgn(x.v)+' %','Variación 2023 → 2024','')}${x.c2?kpi(fmt(x.c2,1),'MW efectivos 2024',''):''}${useIdx(x)?kpi(fmt(useIdx(x),0)+' %','Uso de la capacidad (aprox., 2024)',''):''}${kpi(fmt(100*x.b/TOTB[2024],1)+' %','de la generación bruta CFE 2024','')}</div><div class="row">${bd('of')}${bd('ca')}${SCOPE.cfe}</div></div>`}
 const gSh={F:0,N:0,R:0};GEN.filter(x=>y>2022).forEach(x=>gSh[x.cat]+=x[y===2024?'b':'a']);
 return `<div><h2>Panorama de generación de CFE, ${y}</h2><p class="lead">Indicadores 1 a 4: generación en GWh, participación por tecnología, variación interanual y reparto entre fuentes fósiles y limpias. Usa los filtros de año y tecnología.</p></div>
 <div class="grid g3">
  <div class="card">${kpi(fmt(NET[y],1),'Generación neta CFE (GWh)',vNet!=null?sgn(vNet)+' % frente a '+(y-1):'Sin dato de 2021 en estos documentos')}<div class="row">${bd('of')}${SCOPE.cfe}</div></div>
  <div class="card">${kpi(fmt(LIM[y],1)+' %',tip('limpiadiv','Energía neta limpia y/o diversa'),'2022: 36.0 · 2023: 24.7 · 2024: 25.9')}<div class="row">${bd('of')}${SCOPE.cfe}</div></div>
  <div class="card">${kpi(fmt(fos,1)+' %','Fósil (complemento de lo anterior)','Lo que no es limpia y/o diversa')}<div class="row">${bd('ca')}${SCOPE.cfe}</div></div></div>
 ${selCard}
 <div class="grid g2">
  <div class="card"><h3>Generación y participación por tecnología</h3>${techBlock}</div>
  <div class="card"><h3>Variación interanual</h3>${varBlock}</div></div>
 <div class="card"><div class="row sp"><h3>Fósil frente a limpia, 2022-2024</h3><div class="row">${bd('of')}${bd('ca')}${SCOPE.cfe}</div></div>
  ${[2022,2023,2024].map(a=>`<div class="src">${a}${a===y?' (seleccionado)':''} · generación neta</div><div class="stack" style="${a===y?'outline:2px solid var(--uv);outline-offset:2px':''}"><div class="seg clean" style="flex:${LIM[a]} 1 0" data-t="${a}: ${fmt(LIM[a],1)} % limpia y/o diversa" tabindex="0">${fmt(LIM[a],1)} % limpia</div><div class="seg fos" style="flex:${100-LIM[a]} 1 0" data-t="${a}: ${fmt(100-LIM[a],1)} % fósil (complemento)" tabindex="0">${fmt(100-LIM[a],1)} % fósil</div></div>`).join('')}
  ${y>2022?`<div class="src" style="margin-top:4px">Con la tabla por tecnología (generación bruta ${y}): fósil ${fmt(100*gSh.F/TOTB[y],1)} %, nuclear ${fmt(100*gSh.N/TOTB[y],1)} %, renovable ${fmt(100*gSh.R/TOTB[y],1)} %.</div>`:''}
  <div class="callout">La hidráulica explica buena parte del descenso de la energía limpia: la suma por central de las hidroeléctricas de CFE fue ${fmt(sumP(p=>p.tech==='Hidroeléctrica',2022))} GWh en 2022 y ${fmt(sumP(p=>p.tech==='Hidroeléctrica',2024))} GWh en 2024 (netos).</div>
  <div class="src">Fuente: ${D24}, PDF p. 31 (indicadores) y p. 29. «Limpia y/o diversa» es la etiqueta del informe. El complemento fósil es un cálculo.</div></div>`;
}

/* ===== CENTRALES ===== */
const pk=p=>p.eps+'|'+p.tech+'|'+p.name;
function filtered(){return PLANTS.filter(p=>(st.eps==='all'||p.eps===st.eps)&&(st.tech==='all'||p.tech===st.tech))}
function detailCard(selP){
  let det=`<div class="card" id="detail" aria-live="polite"><b>Selecciona una central</b><span class="note">Verás su ficha con generación 2022, 2023 y 2024, la entidad de CFE y la fuente.</span></div>`;

   det=`<div class="card" id="detail" aria-live="polite"><div class="row sp"><h3>${esc(selP.name)}</h3><span class="badge b-sc">${selP.tech}</span></div>
   <div class="ycols" role="img" aria-label="Generación por año">${[[2022,a],[2023,null],[2024,b]].map(([yy,v])=>`<div class="ycol"><b>${v!=null?fmt(v,1):'sin dato'}</b><div class="yb ${v==null?'nodata':''}" style="height:${v!=null?Math.max(3,110*v/m):44}px"></div><span>${yy}</span></div>`).join('')}</div>
   <dl class="kv"><dt>Unidad</dt><dd>GWh netos</dd><dt>Variación 2022 → 2024</dt><dd>${hasBoth(selP)&&a>0?sgn(100*(b/a-1))+' % (cálculo)':'No se puede calcular: la central aparece solo en 2024'}</dd>
   <dt>Entidad de CFE</dt><dd>${tip('eps','EPS')} ${EPSN[selP.eps]}</dd><dt>Tecnología</dt><dd>${tip(GEN.find(g=>g.k===selP.tech).g,selP.tech)}</dd>
   ${selP.lat!=null?`<dt>Ubicación</dt><dd><b>${esc(selP.ent)}</b><br><span class="note">${selP.lat.toFixed(4)}, ${selP.lon.toFixed(4)} · entidad calculada ubicando el punto en el polígono estatal</span></dd><dt>Capacidad instalada</dt><dd><b>${fmt(selP.mw,1)} MW</b> ${EXT}<br><span class="note">Dato de ${selP.mwy||'2016'} de la base externa (registro ${selP.gid}); puede diferir de la capacidad efectiva actual.${selP.name!==selP.gname?' Nombre en la base: «'+esc(selP.gname)+'».':''}${selP.name.startsWith('Portezuelos')?' La base reporta Portezuelos I y II juntas.':''}</span></dd>`:`<dt>Ubicación</dt><dd><span class="pend">Sin ubicar: no hay una central equivalente en la base externa. No se inventan coordenadas ni MW.</span></dd><dt>Capacidad instalada</dt><dd><span class="pend">Sin dato verificable</span></dd>`}
   <dt>Fuente</dt><dd>${selP.lat!=null?`Ubicación y MW: ${GPPD}<br>`:''}Generación: ${selP.g2022!=null?`${D22}, PDF p. ${selP.p2022}<br>`:''}${selP.g2024!=null?`${D24}, PDF p. ${selP.p2024}`:''}</dd></dl>
   <div class="row">${bd('of')}${bd('ca')}${SCOPE.cfe}${SCOPE.eps}</div></div>`}

/* ===== MAPA ===== */
const SHP={'Hidroeléctrica':{n:'Hidroeléctrica',f:'var(--c-R)',g:'hid'},'Geotermoeléctrica':{n:'Geotermoeléctrica',f:'var(--c-F)',g:'geo'},'Eoloeléctrica':{n:'Eoloeléctrica',f:'var(--c-N)',g:'eol'},'Solar fotovoltaica':{n:'Solar fotovoltaica',f:'var(--surface)',g:'fv'}};
const shape=(tech,r,cls='')=>{const f=SHP[tech].f,s=tech==='Solar fotovoltaica'?';stroke:var(--c-R);stroke-width:2.2':tech==='Eoloeléctrica'?';stroke:var(--c-Nline)':'';
 const a=`class="shp ${cls}" style="fill:${f}${s}"`;
 if(tech==='Hidroeléctrica')return `<circle ${a} r="${r}"/>`;
 if(tech==='Geotermoeléctrica'){const h=r*1.25;return `<polygon ${a} points="0,${-h} ${h*.95},${h*.7} ${-h*.95},${h*.7}"/>`}
 if(tech==='Eoloeléctrica'){const h=r*1.3;return `<polygon ${a} points="0,${-h} ${h},0 0,${h} ${-h},0"/>`}
 return `<rect ${a} x="${-r*.9}" y="${-r*.9}" width="${r*1.8}" height="${r*1.8}"/>`};
const mkIcon=tech=>`<span class="mk"><svg width="16" height="16" viewBox="-9 -9 18 18" aria-hidden="true">${shape(tech,5.5)}</svg></span>`;
const radius=mw=>Math.max(3.2,2.4+Math.sqrt(mw)*.24);
const proj=(lat,lon)=>[(lon-GEO.x0)*GEO.k*GEO.sc,(GEO.y1-lat)*GEO.sc];
function mapCard(y,det){
 const placed=PLANTS.filter(p=>p.lat!=null),ents=[...new Set(placed.map(p=>p.ent))],techs=[...new Set(placed.map(p=>p.tech))];
 const key='g'+y,inF=p=>(st.eps==='all'||p.eps===st.eps)&&(st.tech==='all'||p.tech===st.tech);
 const withPts=new Set(placed.map(p=>p.ent));
 const states=GEO.states.map(s=>`<path class="st ${withPts.has(s.n)?'has':''}" d="${s.d}" data-t="${esc(s.n)}${withPts.has(s.n)?': '+placed.filter(p=>p.ent===s.n).length+' centrales ubicadas':''}"/>`).join('');
 const pts=[...placed].sort((a,b)=>b.mw-a.mw).map(p=>{const [x,yy]=proj(p.lat,p.lon),r=radius(p.mw),on=inF(p),has=p[key]!=null,sel=pk(p)===st.sel;
  const tx=`${p.name} · ${p.ent} · ${p.tech} · ${fmt(p.mw,1)} MW (fuente externa) · ${y===2023?'2023: sin dato por central':has?fmt(p[key],1)+' GWh netos en '+y:'sin dato en '+y}`;
  return `<g class="pt ${on?'':'off'} ${has?'':'nod'} ${sel?'sel':''}" transform="translate(${x.toFixed(1)} ${yy.toFixed(1)})" data-k="${esc(pk(p))}" data-t="${esc(tx)}" tabindex="${on?0:-1}" role="button" aria-label="${esc(tx)}" aria-pressed="${sel}">${sel?`<circle class="halo" r="${(r*1.3+5).toFixed(1)}"/>`:''}${shape(p.tech,r)}</g>`}).join('');
 const vis=placed.filter(inF),bys={};vis.forEach(p=>{if(p[key]!=null)bys[p.ent]=(bys[p.ent]||0)+p[key]});
 const rows=Object.entries(bys).sort((a,b)=>b[1]-a[1]).slice(0,10),mxe=Math.max(1,...rows.map(r=>r[1]));
 const entBlock=y===2023?`<div class="empty">2023 no se publica por central; no hay generación que sumar por entidad. Los puntos muestran solo la ubicación.</div>`
  :rows.length?bars(rows.map(([k,v])=>({k,cat:'R',b:v,txt:fmt(v)+' GWh',tip:`${k}: ${fmt(v)} GWh netos en ${y} (suma de las centrales ubicadas que cumplen los filtros).`})),mxe)+`<div class="row" style="margin-top:6px">${bd('ca')}${SCOPE.cfe}<span class="src">Suma de las centrales ubicadas con los filtros activos (hasta 10 entidades).</span></div>`:`<div class="empty">Sin centrales ubicadas con estos filtros.</div>`;
 const leg=Object.keys(SHP).map(k=>`<span>${mkIcon(k)}${tip(SHP[k].g,k)}</span>`).join('');
 const fosNote=st.tech!=='all'&&!SHP[st.tech]?`<div class="callout">Los informes no traen generación por central de ${esc(st.tech)}, así que sus centrales no se pueden ubicar en este mapa sin inventar datos. Consulta «Panorama» o «Ciclo combinado frente a vapor convencional».</div>`:'';
 return `<div class="split mapsplit" style="margin-bottom:14px"><div class="card"><div class="row sp"><h3>Mapa de centrales de CFE, ${y}</h3><div class="row">${bd('of')}${EXT}${SCOPE.cfe}</div></div>
  <p class="note" style="margin:0 0 8px"><b>${placed.length}</b> centrales ubicadas · <b>${ents.length}</b> entidades federativas · <b>${techs.length}</b> tecnologías. Tamaño del símbolo: capacidad instalada (MW). Opaco: tiene dato de generación en ${y}; tenue: no lo tiene.</p>
  ${fosNote}<div class="mapwrap"><svg class="mapsvg" viewBox="0 0 ${GEO.w} ${GEO.h}" role="group" aria-label="Mapa de México con centrales de CFE">${states}${pts}</svg></div>
  <div class="legend" style="margin-top:8px">${leg}</div>
  <div class="src">Generación (GWh netos): ${D22} y ${D24}. Ubicación y MW: ${GPPD} (datos de 2016 para México). Límites estatales: <a href="https://github.com/angelnmara/geojson" target="_blank" rel="noopener">angelnmara/geojson</a> (archivo mexicoHigh.json, simplificado; no se pudo verificar su origen). La entidad de cada central es un cálculo: se ubica su punto dentro del polígono estatal. ${PLANTS.length-placed.length} de ${PLANTS.length} centrales de los informes no tienen una equivalente en la base externa y no se muestran. El mapa cubre CFE; no incluye PIE ni generación privada.</div>
  <h3 style="margin-top:14px">Generación por entidad federativa</h3>${entBlock}</div>${det}</div>`}
function pCentrales(){
 const selP=PLANTS.find(p=>pk(p)===st.sel),det=detailCard(selP);
 const y=st.year,list=filtered();
 const TECHS_=['Hidroeléctrica','Geotermoeléctrica','Eoloeléctrica','Solar fotovoltaica'];
 let head=`<div><h2>Centrales de CFE con generación publicada</h2><p class="lead">${PLANTS.length} centrales con generación neta en los informes: ${PLANTS.filter(hasBoth).length} con datos en 2022 y 2024. Las tablas por central cubren centrales hidroeléctricas, geotérmicas, eólicas y solares; no hay tabla por central de fósiles.</p></div>`;
 let body;
 if(!TECHS_.includes(st.tech)&&st.tech!=='all'){
  body=`<div class="empty"><b>Sin datos por central para ${esc(st.tech)}.</b><br>Los informes solo publican generación por central de las tecnologías limpias. Para ${esc(st.tech)} consulta la sección «Panorama» (total CFE) o «Ciclo combinado frente a vapor convencional».</div>`;
 }else if(y===2023){
  body=`<div class="empty"><b>El año 2023 no se publica por central.</b><br>El Informe 2024 reporta 2024 por central y el Informe 2022 reporta 2022. El informe anual CFE 2023 completo no está entre los documentos cargados (el «Informe 2023» cargado es de CFE Telecomunicaciones e Internet para Todos).<div class="row" style="margin-top:8px"><button class="btn" data-sety="2022">Ver 2022</button><button class="btn pri" data-sety="2024">Ver 2024</button></div></div>`;
 }else{
  const key='g'+y,rows=list.filter(p=>p[key]!=null).sort((a,b)=>b[key]-a[key]),shown=st.all?rows:rows.slice(0,15),mx=Math.max(1,...rows.map(p=>p[key]));
  const both=list.filter(hasBoth),s22=both.reduce((s,p)=>s+p.g2022,0),s24=both.reduce((s,p)=>s+p.g2024,0);
  const lstHtml=st.view==='chart'?`<div role="group" aria-label="Centrales">${shown.map(p=>`<button class="brow btn-row" aria-pressed="${pk(p)===st.sel}" data-k="${esc(pk(p))}" data-t="${esc(p.name+': '+fmt(p[key],1)+' GWh en '+y)}"><div class="bl">${esc(p.name)}</div><div class="bt"><div class="bf c-${p.tech==='Hidroeléctrica'||p.tech==='Eoloeléctrica'||p.tech==='Solar fotovoltaica'?'R':'R'}" style="width:${Math.max(.6,100*p[key]/mx)}%;${p.tech==='Geotermoeléctrica'?'background:var(--c-F)':p.tech==='Eoloeléctrica'?'background:repeating-linear-gradient(45deg,var(--c-R) 0 3px,transparent 3px 5px);box-shadow:inset 0 0 0 1.5px var(--c-R)':p.tech==='Solar fotovoltaica'?'background:var(--c-N);box-shadow:inset 0 0 0 1.5px var(--c-Nline)':''}"></div></div><div class="bv">${fmt(p[key],1)}</div></button>`).join('')}</div>${rows.length>15?`<button class="btn" id="togAll" style="margin-top:8px">${st.all?'Mostrar solo las 15 mayores':'Mostrar las '+rows.length+' centrales'}</button>`:''}`
  :`<div class="tbls"><table><thead><tr><th>Central</th><th>Tecnología</th><th>EPS</th><th class="n">2022</th><th class="n">2023</th><th class="n">2024</th><th class="n">Var. %</th></tr></thead><tbody>${list.sort((a,b)=>(b.g2024||0)-(a.g2024||0)).map(p=>`<tr><td>${esc(p.name)}</td><td>${p.tech}</td><td>${p.eps}</td><td class="n">${p.g2022!=null?fmt(p.g2022,1):'—'}</td><td class="n">sin dato</td><td class="n">${p.g2024!=null?fmt(p.g2024,1):'—'}</td><td class="n">${hasBoth(p)&&p.g2022>0?sgn(100*(p.g2024/p.g2022-1)):'—'}</td></tr>`).join('')}</tbody></table></div>`;
  body=`<div class="grid g3"><div class="card">${kpi(rows.length,'Centrales con dato en '+y,'Según los filtros')}</div><div class="card">${kpi(fmt(rows.reduce((s,p)=>s+p[key],0)),'GWh netos en '+y,'Suma de esas centrales')}<div class="row">${bd('ca')}</div></div><div class="card">${kpi(both.length?sgn(100*(s24/s22-1))+' %':'—','Variación 2022 → 2024','Centrales con dato en ambos años')}<div class="row">${bd('ca')}</div></div></div>
  <div class="row"><div class="pills" role="group" aria-label="Vista"><button class="pill" data-v="chart" aria-pressed="${st.view==='chart'}">Gráfica</button><button class="pill" data-v="table" aria-pressed="${st.view==='table'}">Tabla</button></div><span class="note">${st.view==='chart'?'Barras: GWh netos de '+y+'. Rayado: eólica; claro con borde: solar; oscuro: geotérmica; violeta: hidráulica.':'Tabla completa de los filtros actuales.'}</span></div>
  <div class="split"><div class="card"><h3>Generación neta por central, ${y}</h3>${lstHtml}<div class="src">Fuente: ${y===2022?D22+' (PDF p. 50, 57, 71-72, 109)':D24+' (PDF p. 35, 40, 44-45, 49, 63)'}. Algunas tablas no suman exactamente su total publicado (EPS II 2024: +0.4 GWh).</div></div></div>`;
 }
 const eclean=`<div class="card"><div class="row sp"><h3>Participación limpia por EPS, 2022 y 2024</h3><div class="row">${bd('of')}${SCOPE.eps}</div></div><div class="legend"><span>Barra clara: 2022</span><span>Barra fuerte: 2024</span></div>${bars(Object.entries(EPSCL).map(([k,v])=>({k:EPSN[k],cat:'R',b:v[1],b2:v[0],txt:fmt(v[0],1)+' → '+fmt(v[1],1)+' %',tip:`${EPSN[k]}: ${v[0]} % (2022) y ${v[1]} % (2024) de su generación neta fue limpia.`})),80)}<div class="src">% de la generación neta de cada EPS que proviene de sus centrales limpias. EPS I 2022: «22 %» según el texto del informe. EPS IV y V no publican esta tabla en 2022. Fuente: ${D22} y ${D24}.</div></div>`;
 const mapa=mapCard(y,det);

/* ===== CC vs VC ===== */
const IND={ // Informe 2024, PDF p.35 (EPS I) y p.44 (EPS III): indisponibilidad por decremento (%): ref, 2023, meta 2024, 2024
 I:{cc:[0.5,1.2,0.6,1.5],vc:[2,12.5,6.9,8.3]},III:{cc:[0.49,3.9,2.5,3.4],vc:[2.08,6.5,2.5,2.6]}};
function pCCVC(){
 const y=st.year;
 if(y===2022)return `<div><h2>Ciclo combinado frente a vapor convencional</h2></div><div class="empty"><b>Sin desglose por tecnología en 2022.</b><br>Los informes cargados publican esta comparación para 2023 y 2024.<div class="row" style="margin-top:8px"><button class="btn" data-sety="2023">Ver 2023</button><button class="btn pri" data-sety="2024">Ver 2024</button></div></div>`;
 const cc=GEN[0],vc=GEN[1],k=y===2024?'b':'a',g=x=>x[k],c=x=>y===2024?x.c2:x.c1;
 const side=(x,fuel,cyc,gl)=>`<div class="card"><h3>${tip(gl,x.k)}</h3><div class="grid g2">${kpi(fmt(g(x)),'GWh brutos '+y,'')}${kpi(fmt(100*g(x)/TOTB[y],1)+' %','de la generación bruta de CFE','')}${kpi(fmt(c(x),1),'MW efectivos','')}${kpi(y===2024?fmt(useIdx(x),0)+' %':'—',tip('factor','Uso de la capacidad'),y===2024?'Aproximado':'Solo 2024: falta la capacidad 2022')}${kpi(sgn(x.v)+' %','Variación 2023 → 2024','')}</div><dl class="kv"><dt>Combustible</dt><dd>${fuel}</dd><dt>Ciclo</dt><dd>${cyc}</dd></dl></div>`;
 const share=100*c(cc)/(c(cc)+c(vc)),gsh=100*g(cc)/(g(cc)+g(vc));
 const rowI=(e,l)=>{const d=IND[e];return `<tr><th scope="row">${l}</th><td class="n">${d.cc[1]}</td><td class="n">${d.cc[3]}</td><td class="n">${d.cc[0]}</td><td class="n">${d.vc[1]}</td><td class="n">${d.vc[3]}</td><td class="n">${d.vc[0]}</td></tr>`};
 return `<div><h2>Ciclo combinado frente a vapor convencional, ${y}</h2><p class="lead">Indicador 5. Los datos son de CFE (sin PIE); el ciclo combinado de los PIE no está incluido.</p></div>
 <div class="grid g2">${side(cc,'Gas natural',`${tip('brayton','Brayton')} + ${tip('rankine','Rankine')}: turbina de gas y vapor con ${tip('hrsg','caldera de recuperación')}`,'cc')}${side(vc,'Combustóleo y gas natural (Informe 2024, PDF p. 39)',`${tip('rankine','Rankine')}: caldera y turbina de vapor`,'vc')}</div>
 <div class="card"><div class="row sp"><h3>Generación frente a capacidad</h3><div class="row">${bd('of')}${bd('ca')}${SCOPE.cfe}</div></div>
  <div class="src">Reparto entre las dos tecnologías, ${y}</div>${stack([{v:c(cc),l:'CC '+fmt(share,0)+' % de la capacidad',cls:'c-R',tip:'Ciclo combinado: '+fmt(c(cc),1)+' MW'},{v:c(vc),l:'VC '+fmt(100-share,0)+' %',cls:'c-F',tip:'Vapor convencional: '+fmt(c(vc),1)+' MW'}])}
  <div class="src">de la generación</div>${stack([{v:g(cc),l:'CC '+fmt(gsh,0)+' % de la generación',cls:'c-R',tip:'Ciclo combinado: '+fmt(g(cc))+' GWh'},{v:g(vc),l:'VC '+fmt(100-gsh,0)+' %',cls:'c-F',tip:'Vapor convencional: '+fmt(g(vc))+' GWh'}])}
  <div class="callout">Con ${fmt(share,0)} % de la capacidad de las dos tecnologías, el ciclo combinado aportó ${fmt(gsh,0)} % de su generación en ${y}. Esto indica que opera más horas y/o con mayor despacho. El informe no desglosa por qué.</div></div>
 <div class="card"><div class="row sp"><h3>${tip('indisp','Indisponibilidad por decremento')} (%)</h3><div class="row">${bd('of')}${SCOPE.eps}</div></div>
  <div class="tblwrap"><table><thead><tr><th></th><th class="n" colspan="3">Ciclo combinado</th><th class="n" colspan="3">Vapor convencional</th></tr><tr><th>EPS</th><th class="n">2023</th><th class="n">2024</th><th class="n">Ref. int.</th><th class="n">2023</th><th class="n">2024</th><th class="n">Ref. int.</th></tr></thead><tbody>${rowI('I','CFE Generación I')}${rowI('III','CFE Generación III')}</tbody></table></div>
  <div class="src">Fuente: ${D24}, PDF p. 35 (EPS I) y p. 44 (EPS III). Referencia internacional: Euroelectric. Es el resultado de dos EPS, no de todo CFE. Menor valor = más disponibilidad.</div></div>`;
}

 <div class="card"><h3>CFE y resto del país, 2022-2024</h3>${[2022,2023,2024].map(a=>{const e=NET[a]/(SHR[a]/100);return `<div class="src">${a}${a===y?' (seleccionado)':''} · total estimado ${fmt(e/1000,1)} TWh</div><div class="stack" style="${a===y?'outline:2px solid var(--uv);outline-offset:2px':''}"><div class="seg c-F" style="flex:${NET[a]} 1 0" data-t="CFE ${a}: ${fmt(NET[a]/1000,1)} TWh (${SHR[a]} %)" tabindex="0">CFE ${fmt(NET[a]/1000,1)} TWh</div><div class="seg est" style="flex:${e-NET[a]} 1 0" data-t="Resto del país ${a} (estimado): ${fmt((e-NET[a])/1000,1)} TWh" tabindex="0">Resto (est.) ${fmt((e-NET[a])/1000,1)} TWh</div></div>`}).join('')}
  <div class="row" style="margin-top:6px">${bd('of')}${bd('es')}${SCOPE.est}</div>
  <div class="src">Fuente: ${D24}, PDF p. 31. El segmento rayado es una estimación, no un dato publicado.</div></div>
 <div class="grid g2">
  <div class="card"><div class="row sp"><h3>CFE frente a CFE + PIE, 2024</h3><div class="row">${bd('of')}${bd('ca')}${SCOPE.pie}</div></div>
   ${stack([{v:148.8,l:'CFE 148.8 TWh',cls:'c-F'},{v:103.6,l:'PIE 103.6 TWh',cls:'c-R'}])}
   <dl class="kv"><dt>CFE + PIE</dt><dd>252.3 TWh · 84 % fósil</dd><dt>CFE</dt><dd>74 % fósil, 26 % limpia</dd><dt>${tip('pie','PIE')}</dt><dd>97.6 % gas natural, 0.9 % diésel, 1.5 % eólica</dd><dt>Frente al total nacional implícito (2024)</dt><dd>${fmt(100*252.3/(NET[2024]/(SHR[2024]/100)/1000),0)} % <span class="badge b-es">Estimación</span></dd></dl>
   <div class="callout">El 84 % fósil es de CFE + PIE, no nacional. El resto del país (≈${fmt(100-100*252.3/(NET[2024]/(SHR[2024]/100)/1000),0)} % del total implícito) no está en estos informes.</div>
   <div class="src">Fuente: ${D24}, PDF p. 195. Cálculo: 252.3 ÷ (148.775 ÷ 0.423). Dato de 2022 relacionado: los PIE entregaron 96.9 TWh de energía neta facturada (${D22}, PDF p. 88), con base distinta.</div></div>
  <div class="card"><div class="row sp"><h3>Capacidad: CFE frente a nacional, 2022</h3><div class="row">${bd('of')}${bd('ca')}${SCOPE.sen}</div></div>
   ${kpi(fmt(100*44073.3/92503,1)+' %','CFE (44 073.3 MW) sobre el SEN (92 503 MW)','')}
   <dl class="kv"><dt>SEN, capacidad instalada neta</dt><dd>92 503 MW (PRODESEN, PDF p. 4)</dd><dt>SEN, energía limpia</dt><dd>36.9 % de la capacidad (PDF p. 6)</dd><dt>CFE, capacidad efectiva</dt><dd>44 073.3 MW (${D24}, PDF p. 26)</dd></dl>
   <div class="callout">CFE tenía cerca de la mitad de la capacidad pero generó 41.1 % de la energía. Las bases difieren (capacidad efectiva de CFE sin PIE frente a capacidad instalada neta del SEN con generación distribuida), así que es una comparación aproximada.</div></div></div>`;
}

/* ===== TECNOLOGÍAS Y CICLOS ===== */
const CYC={
 vc:{n:'Vapor convencional (Rankine)',st:[['Caldera','El combustible (combustóleo o gas natural) se quema y su calor convierte el agua en vapor a alta presión.'],['Turbina de vapor','El vapor se expande y hace girar la turbina: aquí se obtiene la potencia mecánica.'],['Generador','Acoplado al eje, convierte el giro en electricidad por inducción electromagnética.'],['Condensador','El vapor que sale de la turbina cede calor y vuelve a ser agua.'],['Bomba','Eleva la presión del agua y la regresa a la caldera. El ciclo se cierra.']],d:'CFE, 2024: '+fmt(28135)+' GWh brutos y 9 697.6 MW (Informe 2024, PDF p. 24 y 29).'},
 tg:{n:'Turbogás (Brayton)',st:[['Compresor','Toma aire y lo comprime a alta presión.'],['Cámara de combustión','Se inyecta combustible (gas natural o diésel) y se quema: sube la temperatura de los gases.'],['Turbina de gas','Los gases se expanden y mueven la turbina; una parte de la potencia mueve el compresor.'],['Generador','Convierte el giro del eje en electricidad.'],['Escape','Los gases salen aún calientes: ese calor se pierde, salvo que se recupere (ciclo combinado).']],d:'CFE, 2024: '+fmt(8379)+' GWh brutos y 2 940.9 MW (Informe 2024, PDF p. 24 y 29).'},
 cc:{n:'Ciclo combinado (Brayton + Rankine)',st:[['Turbina de gas','Primer ciclo (Brayton): compresor, cámara de combustión y turbina mueven un generador.'],['Gases de escape','Salen de la turbina a temperatura alta, con mucha energía aprovechable.'],['Caldera de recuperación','Los gases calientan agua y producen vapor sin quemar combustible adicional (o con muy poco).'],['Turbina de vapor','Segundo ciclo (Rankine): el vapor mueve otra turbina con su generador.'],['Condensador','El vapor se condensa y el agua regresa a la caldera de recuperación.']],d:'CFE, 2024: '+fmt(61490)+' GWh brutos y 10 912.4 MW (Informe 2024, PDF p. 24 y 29). Gas natural como combustible típico.'}
};
function pTec(){
 const c=CYC[st.cyc];
 const cards=[['vc','Vapor convencional','Caldera + turbina de vapor.'],['tg','Turbogás','Turbina de gas sin recuperación.'],['cc','Ciclo combinado','Gas y vapor combinados.'],['carbo','Carboeléctrica','Rankine con carbón.'],['nuclear','Nucleoeléctrica','Rankine con calor de fisión.'],['ci','Combustión interna','Motores, etiquetados «Diésel».'],['hid','Hidroeléctrica','Turbina hidráulica.'],['geo','Geotermoeléctrica','Vapor del subsuelo.'],['eol','Eoloeléctrica','Aerogenerador.'],['fv','Solar fotovoltaica','Celdas y inversor.']];
 return `<div><h2>Tecnologías y ciclos termodinámicos</h2><p class="lead">Pasa el cursor, enfoca con el teclado o toca los términos subrayados para ver su definición. Elige un ciclo y selecciona cada etapa.</p></div>
 <div class="card"><div class="pills" role="group" aria-label="Ciclo">${Object.entries(CYC).map(([k,v])=>`<button class="pill" data-cyc="${k}" aria-pressed="${st.cyc===k}">${v.n}</button>`).join('')}</div>
  <div class="flow">${c.st.map((s,i)=>`<button class="node" data-cs="${i}" aria-pressed="${st.cycStep===i}"><b>${s[0]}</b></button>${i<c.st.length-1?'<div class="arrow" aria-hidden="true"></div>':''}`).join('')}</div>
  <div class="callout" aria-live="polite"><b>${c.st[st.cycStep][0]}.</b> ${esc(c.st[st.cycStep][1])}</div>
  <div class="row">${bd('co')}${bd('of')}<span class="src">${c.d}</span></div></div>
 <div class="grid g3">${cards.map(x=>`<div class="card"><h3>${tip(x[0],x[1])}</h3><span class="note">${x[2]}</span></div>`).join('')}</div>
 <div class="card"><h3>¿Por qué el ciclo combinado aprovecha mejor el combustible?</h3><p>El turbogás desecha sus gases a alta temperatura. Si esos gases producen vapor y el vapor mueve otra turbina, la misma cantidad de combustible genera electricidad dos veces. El vapor convencional solo usa el ciclo de vapor. ${bd('co')}</p><p class="note">Los informes no publican la eficiencia por tecnología, por lo que aquí no se da una cifra. En CFE completo, la eficiencia térmica neta fue 34.5 % en 2024 (PDF p. 31).</p></div>`;
}

/* ===== pestañas y render ===== */
const TABS=[['panorama','Panorama',pPanorama],['centrales','Centrales',pCentrales],['ccvc','CC frente a VC',pCCVC],['nacional','CFE y nacional',pNacional],['tecnologias','Tecnologías y ciclos',pTec]];
function foot(){return `<footer><details><summary>Fuentes y límites de los datos</summary><ul>
 <li><b>${D24}</b> (v. 7-jul-2025): tecnología (PDF p. 29), capacidad (p. 24), indicadores 2022-2024 (p. 31), tablas por central de 2024 (p. 35, 40, 44-45, 49, 63), CFE + PIE (p. 195).</li>
 <li><b>${D22}</b> (27-abr-2023): tablas por central de 2022 (PDF p. 50, 57, 71-72, 109) y PIE (p. 88).</li>
 <li><b>PRODESEN 2023-2037, Cap. 4:</b> capacidad nacional 2022.</li>
 <li><b>Sin dato en los documentos:</b> generación por central en 2023; capacidad MW y ubicación por central (se tomaron de una fuente externa, ver abajo); generación por central de fósiles; total nacional por tecnología; EPS V y algunas tablas de EPS IV.</li>
 <li><b>Fuentes externas del mapa:</b> coordenadas y capacidad instalada (MW) de la <a href="https://github.com/wri/global-power-plant-database" target="_blank" rel="noopener">Global Power Plant Database (WRI, CC BY 4.0)</a>, datos de 2016 para México; límites estatales de <a href="https://github.com/angelnmara/geojson" target="_blank" rel="noopener">angelnmara/geojson</a> (origen no verificado). Son datos externos, no oficiales de CFE ni de INEGI; para un trabajo final conviene contrastarlos con SENER/CRE e INEGI. La generación (GWh) nunca viene de ellos.</li>
 <li><b>Total nacional:</b> es una estimación (CFE ÷ participación publicada). No se debe citar como dato oficial.</li>
 <li><b>Redondeos:</b> la suma de la tabla por central de EPS II 2024 da 5 338.1 GWh y el total publicado es 5 337.7.</li>
 <li><b>Marca:</b> colores muestreados del kit Ultravioleta v1.0; logotipo provisional en baja resolución.</li></ul></details></footer>`}
function renderAll(){
 const act=TABS.find(t=>$('#t-'+t[0]).getAttribute('aria-selected')==='true')||TABS[0];
 TABS.forEach(t=>{const s=$('#p-'+t[0]);if(t===act||!s.dataset.done||true){s.innerHTML=t[2]()}});
 bind();
}
function bind(){
 $$('[data-sety]').forEach(b=>b.onclick=()=>{st.year=+b.dataset.sety;drawFilters();renderAll()});
 $$('[data-k]').forEach(b=>b.onclick=()=>{st.sel=b.dataset.k;renderAll();say('Central seleccionada');const d=$('#detail');if(d&&innerWidth<900)d.scrollIntoView({block:'nearest'})});
 $$('g[data-k]').forEach(g=>g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();g.dispatchEvent(new MouseEvent('click'))}});
 $$('[data-v]').forEach(b=>b.onclick=()=>{st.view=b.dataset.v;renderAll()});
 const ta=$('#togAll');if(ta)ta.onclick=()=>{st.all=!st.all;renderAll()};
 $$('[data-cyc]').forEach(b=>b.onclick=()=>{st.cyc=b.dataset.cyc;st.cycStep=0;renderAll()});
 $$('[data-cs]').forEach(b=>b.onclick=()=>{st.cycStep=+b.dataset.cs;renderAll()});
}
const tl=$('#tablist');
TABS.forEach(([id,n])=>{const b=document.createElement('button');b.className='tab';b.id='t-'+id;b.setAttribute('role','tab');b.setAttribute('aria-controls','p-'+id);b.textContent=n;b.onclick=()=>go(id);tl.append(b);
 const s=document.createElement('section');s.className='panel';s.id='p-'+id;s.setAttribute('role','tabpanel');s.setAttribute('aria-labelledby','t-'+id);s.hidden=true;$('#main').append(s)});
$('#main').insertAdjacentHTML('beforeend',foot());
function go(id,fromHash){if(!TABS.some(t=>t[0]===id))id='panorama';
 TABS.forEach(([t])=>{$('#p-'+t).hidden=t!==id;const b=$('#t-'+t);b.setAttribute('aria-selected',t===id);b.tabIndex=t===id?0:-1});
 hideTip();if(!fromHash){try{history.replaceState(null,'','#'+id)}catch(e){}}renderAll();$('#t-'+id).scrollIntoView({block:'nearest',inline:'center'})}
tl.addEventListener('keydown',e=>{const i=TABS.findIndex(t=>$('#t-'+t[0]).getAttribute('aria-selected')==='true');if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const j=(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length;go(TABS[j][0]);$('#t-'+TABS[j][0]).focus()}});
addEventListener('hashchange',()=>go(location.hash.slice(1),true));
drawFilters();go(location.hash.slice(1)||'panorama',true);
</script>

</body>
</html>
