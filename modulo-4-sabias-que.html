<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>¿Sabías que?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

/* Concepto: tablero de estudio con barra de módulos arriba, pestañas de sección fijas y paneles de gráfica + detalle.
   Identidad: solo los 4 tonos del kit Ultravioleta v1.0 (valores muestreados del kit, validar contra HEX oficial). Arial Bold / Regular. */
:root{
  --pn:#32095F; --vr:#4B1C8F; --uv:#8E4DF2; --ls:#E4CCFF;
  --bg:#F4F0FB; --surface:#FFFFFF; --surface2:#EFE6FC; --ink:#1F0645; --ink2:#4B1C8F;
  --muted:color-mix(in srgb,var(--ink) 68%,var(--surface)); --line:color-mix(in srgb,var(--ink) 16%,var(--surface));
  --c-F:#32095F; --c-N:#E4CCFF; --c-Nline:#4B1C8F; --c-R:#8E4DF2;
  --accent:#8E4DF2; --on-accent:#FFFFFF; --hd:#32095F; --on-hd:#FFFFFF; --focus:#8E4DF2;
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1F0645; --surface:#32095F; --surface2:color-mix(in srgb,#4B1C8F 55%,#32095F); --ink:#F4F0FB; --ink2:#E4CCFF;
  --c-F:#E4CCFF; --c-N:#4B1C8F; --c-Nline:#E4CCFF; --c-R:#8E4DF2; --hd:#1F0645; --focus:#E4CCFF; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1F0645; --surface:#32095F; --surface2:color-mix(in srgb,#4B1C8F 55%,#32095F); --ink:#F4F0FB; --ink2:#E4CCFF;
  --c-F:#E4CCFF; --c-N:#4B1C8F; --c-Nline:#E4CCFF; --c-R:#8E4DF2; --hd:#1F0645; --focus:#E4CCFF; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hd)}
h1,h2,h3,h4{font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:22px}h3{font-size:17px}h4{font-size:14px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto}
.band{margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--hd);color:var(--on-hd);padding-block:14px 12px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.logo{height:40px;width:auto;border-radius:6px;background:#fff;padding:2px 6px;display:block}
.ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.ttl b{font-size:18px}.ttl span{font-size:12px;opacity:.85}
.mods{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.mod{border:1px solid color-mix(in srgb,#fff 35%,transparent);background:transparent;color:var(--on-hd);padding:6px 12px;border-radius:999px;font-size:13px}
.mod[aria-current="page"]{background:var(--ls);color:var(--pn);border-color:var(--ls);font-weight:700}
.mod[disabled]{opacity:.6;cursor:not-allowed}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.tabs [role=tablist]{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;max-width:1180px;margin:0 auto}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--vr);color:#fff;border-color:var(--vr);font-weight:700}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:var(--uv)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{background:var(--uv)}}
main{padding-top:20px;display:flex;flex-direction:column;gap:20px}
section.panel{display:flex;flex-direction:column;gap:16px}
.lead{color:var(--muted);max-width:75ch}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.alt{background:var(--surface2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:1;padding:4px 7px;border-radius:5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.b-of{background:var(--pn);color:#fff;border:1px solid var(--pn)}
:root[data-theme="dark"] .b-of{background:var(--ls);color:var(--pn);border-color:var(--ls)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b-of{background:var(--ls);color:var(--pn);border-color:var(--ls)}}
.b-ca{border:1.5px solid var(--ink2);color:var(--ink2)}
.b-si{border:1.5px dashed var(--ink2);color:var(--ink2)}
.b-es{border:1.5px dotted var(--ink2);color:var(--ink2)}
.b-co{background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.b-sc{background:var(--ls);color:var(--pn)}
.tip{border-bottom:1.5px dotted var(--ink2);cursor:help;text-decoration:none}
.tip:focus-visible{outline-offset:1px}
#tooltip{position:fixed;z-index:60;max-width:min(340px,calc(100vw - 24px));background:var(--pn);color:#fff;border:1px solid var(--ls);
  padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.45;box-shadow:0 6px 20px rgba(31,6,69,.35);pointer-events:none}
#tooltip .tt-t{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ls);margin-bottom:4px;font-weight:700}
#tooltip .tt-s{margin-top:6px;font-size:11px;color:var(--ls)}
.chain{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;position:relative;min-width:0;display:flex;flex-direction:column;gap:4px}
.step small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.step b{font-size:15px}
.step:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--ink2);font-weight:700;z-index:2;background:var(--bg);border-radius:50%;width:16px;text-align:center;line-height:16px}
@media (max-width:720px){.chain{grid-template-columns:1fr}.step:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-12px;transform:translateX(-50%)}}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.pill[aria-pressed="true"],.pill[aria-selected="true"]{background:var(--vr);color:#fff;border-color:var(--vr);font-weight:700}
:root[data-theme="dark"] .pill[aria-pressed="true"]{background:var(--uv)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill[aria-pressed="true"]{background:var(--uv)}}
.fam{border-top:5px solid var(--c-F)}.fam.N{border-top-color:var(--c-Nline)}.fam.R{border-top-color:var(--c-R)}
.chip{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px;margin:0 4px 4px 0}
button.chip{cursor:pointer}button.chip[aria-pressed="true"]{background:var(--vr);color:#fff;border-color:var(--vr)}
.note{font-size:13px;color:var(--muted)}
.callout{border-left:4px solid var(--uv);background:var(--surface2);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
.sets{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;align-items:stretch}
.set{border:2px solid var(--ink2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.set.inner{border-style:dashed;background:var(--surface2)}
.set h4{font-size:13px}
@media (max-width:640px){.sets{grid-template-columns:1fr}}
/* barras */
.brow{display:grid;grid-template-columns:minmax(96px,150px) 1fr minmax(70px,auto);gap:8px;align-items:center;padding:3px 0;border-radius:6px}
.brow:hover,.brow:focus-visible{background:var(--surface2)}
.bl{font-size:13px;min-width:0}
.bt{height:12px;background:color-mix(in srgb,var(--ink) 8%,var(--surface));border-radius:0 4px 4px 0;position:relative}
.bt.two{height:22px;background:none;display:flex;flex-direction:column;gap:2px}
.bf{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.two .bf{height:10px}
.two .bf.prev{opacity:.45}
.bv{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.c-F{background:var(--c-F)}.c-R{background:var(--c-R)}
.c-N{background:repeating-linear-gradient(45deg,var(--c-N) 0 4px,color-mix(in srgb,var(--c-Nline) 55%,var(--c-N)) 4px 6px);box-shadow:inset 0 0 0 1.5px var(--c-Nline)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.stack{display:flex;height:34px;gap:2px;border-radius:6px;overflow:hidden}
.seg{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;min-width:0;overflow:hidden;color:#fff}
.seg.c-F{color:var(--surface)}.seg.c-N{color:var(--ink)}
:root:not([data-theme="dark"]) .seg.c-F{color:#fff}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:30px;font-variant-numeric:tabular-nums;color:var(--ink2);line-height:1.05}
.kpi span{font-size:12px;color:var(--muted)}
/* clasificador */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:10px;border:1px dashed var(--ink2);border-radius:10px}
.kc{border:1.5px solid var(--ink2);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;cursor:grab;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left}
.kc small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kc[aria-pressed="true"]{background:var(--vr);color:#fff;border-color:var(--vr)}
.kc[aria-pressed="true"] small{color:var(--ls)}
.kc.ok{cursor:default;background:var(--surface2)}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.zone{border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:150px;background:var(--surface)}
.zone.over{border-color:var(--uv);background:var(--surface2)}
.zone .place{align-self:flex-start;border:1.5px solid var(--ink2);background:transparent;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:700}
.zone .place:disabled{opacity:.4;cursor:not-allowed}
.zl{display:flex;flex-wrap:wrap;gap:6px}
.feedback{border:1.5px solid var(--ink2);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--surface2);min-height:48px}
.feedback.bad{border-style:dashed}
.score{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.score b{font-size:20px;font-variant-numeric:tabular-nums}
.btn{border:1.5px solid var(--ink2);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:700;font-size:13px}
.btn.pri{background:var(--vr);border-color:var(--vr);color:#fff}
:root[data-theme="dark"] .btn.pri{background:var(--uv);border-color:var(--uv)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{background:var(--uv);border-color:var(--uv)}}
/* conversión */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:0}
.node{flex:1 1 130px;min-width:0;border:1.5px solid var(--ink2);background:var(--surface);border-radius:10px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:3px;position:relative}
.node small{font-size:11px;color:var(--muted)}
.node[aria-pressed="true"]{background:var(--vr);color:#fff;border-color:var(--vr)}
.node[aria-pressed="true"] small{color:var(--ls)}
.arrow{flex:0 0 28px;display:flex;align-items:center;justify-content:center;position:relative;color:var(--ink2);font-weight:700}
.arrow::before{content:"";position:absolute;left:2px;right:2px;top:50%;height:2px;background:repeating-linear-gradient(90deg,var(--uv) 0 6px,transparent 6px 10px);background-size:20px 2px;animation:dash 1s linear infinite}
.arrow::after{content:"▶";font-size:10px;position:absolute;right:0;top:50%;transform:translateY(-50%)}
@keyframes dash{to{background-position:20px 0}}
@media (max-width:720px){.flow{flex-direction:column}.arrow{flex:0 0 26px;height:26px}.arrow::before{left:50%;right:auto;top:2px;bottom:2px;width:2px;height:auto;background:repeating-linear-gradient(180deg,var(--uv) 0 6px,transparent 6px 10px);background-size:2px 20px;animation:dashv 1s linear infinite}.arrow::after{content:"▼";right:auto;left:50%;top:auto;bottom:0;transform:translateX(-50%)}}
@keyframes dashv{to{background-position:0 20px}}
@media (prefers-reduced-motion:reduce){.arrow::before{animation:none}}
.ener{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
/* comparador */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-weight:700;background:var(--surface2)}
tbody th{width:150px;background:var(--surface)}
tr:last-child td,tr:last-child th{border-bottom:0}
/* quiz */
.opts{display:flex;flex-direction:column;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;text-align:left;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--uv)}
.opt.sel{border-color:var(--ink2);border-width:2px}
.opt.right{border-color:var(--uv);background:var(--surface2);border-width:2.5px}
.opt.wrong{border-style:dashed;border-width:2px}
.opt:disabled{cursor:default}
.qn{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
input[type=range]{width:100%;accent-color:var(--uv)}
.src{font-size:12px;color:var(--muted)}
.src b{color:var(--ink)}
footer{margin-top:10px;display:flex;flex-direction:column;gap:12px}
details{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 14px}
summary{cursor:pointer;font-weight:700}
details ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px}

/* ===== añadidos del tablero de centrales ===== */
.filters{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fgrp{display:flex;flex-direction:column;gap:4px}
.fgrp label,.fgrp .fl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--ink2);border-radius:8px;padding:7px 10px;max-width:100%}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.brow.btn-row{cursor:pointer;width:100%;background:none;border:0;text-align:left;padding:4px 6px;border-radius:6px;font:inherit;color:inherit}
.brow.btn-row[aria-pressed="true"]{background:var(--surface2);outline:2px solid var(--uv)}
.dim{opacity:.3}
.dt{height:14px;position:relative;background:color-mix(in srgb,var(--ink) 8%,var(--surface));border-radius:4px}
.dz{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink2)}
.db{position:absolute;top:2px;bottom:2px;border-radius:3px}
.ycols{display:flex;gap:14px;align-items:flex-end;height:150px;padding:4px 0}
.ycol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.ycol .yb{width:100%;max-width:70px;border-radius:5px 5px 0 0;background:var(--c-R)}
.ycol .yb.nodata{background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--ink2) 35%,transparent) 5px 7px);border:1.5px dashed var(--ink2);height:44px!important}
.ycol b{font-size:13px;font-variant-numeric:tabular-nums;text-align:center}
.ycol span{font-size:12px;color:var(--muted)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pend{border:1.5px dashed var(--ink2);border-radius:8px;padding:6px 10px;font-size:13px;background:var(--surface2)}
.mapph{border:2px dashed var(--ink2);border-radius:12px;padding:16px;background:repeating-linear-gradient(135deg,transparent 0 12px,color-mix(in srgb,var(--ink2) 8%,transparent) 12px 14px)}
.b-ext{background:transparent;color:var(--ink);border:1.5px dashed var(--ink2)}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--ink) 4%,var(--surface));overflow:hidden}
.mapsvg{display:block;width:100%;height:auto}
.mapsvg .st{fill:var(--surface2);stroke:var(--ink2);stroke-width:.8;stroke-opacity:.55;vector-effect:non-scaling-stroke}
.mapsvg .st.has{fill:color-mix(in srgb,var(--c-R) 16%,var(--surface2))}
.mapsvg .pt{cursor:pointer;outline:none}
.mapsvg .pt .shp{stroke:var(--surface);stroke-width:1.6;vector-effect:non-scaling-stroke}
.mapsvg .pt.off{opacity:.12;pointer-events:none}
.mapsvg .pt.nod{opacity:.4}
.mapsvg .pt:hover .shp,.mapsvg .pt:focus-visible .shp{stroke:var(--focus);stroke-width:3}
.mapsvg .pt.sel .shp{stroke:var(--focus);stroke-width:3.5}
.mapsvg .pt.sel .halo{fill:none;stroke:var(--focus);stroke-width:2;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.mk{display:inline-block;vertical-align:-3px;margin-right:4px}
.mk svg{display:block}
@media (max-width:900px){.mapsplit{grid-template-columns:1fr!important}}
.empty{border:1.5px dashed var(--ink2);border-radius:10px;padding:14px;background:var(--surface2)}
.tbls{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:420px;overflow-y:auto}
.tbls table{min-width:720px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg.c-F,.seg.c-R{color:#fff}
:root[data-theme="dark"] .seg.c-F{color:var(--pn)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg.c-F{color:var(--pn)}}
.seg.clean{background:var(--c-R);color:#fff}
.seg.fos{background:var(--c-F);color:#fff}
:root[data-theme="dark"] .seg.fos{color:var(--pn)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg.fos{color:var(--pn)}}
.seg.est{background:repeating-linear-gradient(135deg,var(--surface2) 0 6px,color-mix(in srgb,var(--ink2) 30%,var(--surface2)) 6px 8px);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink2)}
.seg.hl{outline:3px solid var(--ls);outline-offset:-3px}
.cyc{display:flex;flex-wrap:wrap;gap:6px}
.dg{display:block;width:100%;height:auto}
.dg .bx{fill:var(--surface2);stroke:var(--ink2);stroke-width:1.5}
.dg .bx.iso{stroke-dasharray:6 4}
.dg .bx.sin{fill:color-mix(in srgb,var(--c-R) 18%,var(--surface2));stroke:var(--c-R);stroke-width:2.2}
.dg .bx.rnt{fill:var(--surface);stroke:var(--ink2);stroke-width:2}
.dg .bx.ext{fill:transparent;stroke:var(--ink2);stroke-dasharray:2 4}
.dg text{fill:var(--ink);font-family:var(--font)}
.dg .h{font-weight:700;font-size:13px}.dg .s{font-size:11.5px;fill:var(--muted)}
.dg .ar{stroke:var(--c-R);stroke-width:2.6;fill:none}.dg .arh{fill:var(--c-R)}
.dg .sep{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:3 5;opacity:.7}
.dg g[data-t]{outline:none}.dg g[data-t]:focus-visible .bx,.dg g[data-t]:hover .bx{stroke:var(--focus);stroke-width:3}
.ctl{display:grid;grid-template-columns:1fr;gap:12px}
.ctl .f{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:4px 10px;align-items:center}
.ctl .f label{grid-column:1/-1;font-size:13px;font-weight:700}
.ctl input[type=range]{width:100%;accent-color:var(--uv)}
.ctl input[type=number]{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--ink2);border-radius:8px;padding:6px 8px;width:100%;font-variant-numeric:tabular-nums}
.ctl input:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lc{display:block;width:100%;height:auto}
.lc text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.lc .gl{stroke:var(--line);stroke-width:1}.lc .ax{stroke:var(--ink2);stroke-width:1.2}
.lc .ln{fill:none;stroke:var(--c-R);stroke-width:2.6;stroke-linejoin:round}
.lc .cur{fill:var(--c-R);stroke:var(--focus);stroke-width:3}
.lc .cur2{stroke:var(--focus);stroke-width:1.4;stroke-dasharray:3 3}
.lc .hit{fill:transparent;cursor:crosshair}.lc .hit:hover,.lc .hit:focus-visible{fill:color-mix(in srgb,var(--focus) 35%,transparent);outline:none}
.fm{font-size:15px;background:var(--surface2);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.warn{border-left:4px solid var(--ink2);background:var(--surface2);padding:8px 12px;border-radius:6px;font-size:14px}
.chip{border:1.5px solid var(--ink2);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink2);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:var(--pn);background:var(--ls)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:var(--pn);background:var(--ls)}}
.sim2{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.sim2{grid-template-columns:1fr}}

.msys .st{fill:color-mix(in srgb,var(--c-R) 22%,var(--surface2));cursor:pointer;transition:opacity .15s}
.msys .st.sy-SIBC{fill:url(#pBC)}.msys .st.sy-SIBCS{fill:url(#pBCS)}
.msys .st.off{opacity:.28}
.msys .st.on{stroke:var(--focus);stroke-width:2.4;stroke-opacity:1}
.msys .st:focus-visible{stroke:var(--focus);stroke-width:2.6;stroke-opacity:1;outline:none}
.pbg{fill:color-mix(in srgb,var(--c-R) 10%,var(--surface))}.pln{stroke:var(--ink2);stroke-width:2.6}.pdt{fill:var(--ink2)}
.msys .st.sy-SIBC,.msys .st.sy-SIBCS{stroke-width:1.6;stroke-opacity:.9}
.mulg{cursor:pointer;outline:none}.mulr{fill:var(--surface);stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:6 4}
.mulr.on,.mulg:focus-visible .mulr,.mulg:hover .mulr{stroke:var(--focus);stroke-width:3}
.mult{fill:var(--ink);font-size:13px;font-weight:700;font-family:var(--font)}.mult.s2{font-weight:400;font-size:11.5px;fill:var(--muted)}
.sw.hatch{background:repeating-linear-gradient(45deg,var(--ink2) 0 2px,var(--surface2) 2px 5px);border:1px solid var(--ink2)}
.sw.dots{background:radial-gradient(var(--ink2) 1.3px,var(--surface2) 1.6px) 0 0/6px 6px;border:1px solid var(--ink2)}

.opts{display:grid;gap:8px;margin-top:8px}
.opt{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:1.5px solid var(--ink2);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt:hover:not(:disabled){background:var(--surface2)}
.opt:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.opt:disabled{cursor:default}
.opt.ok{background:color-mix(in srgb,var(--c-R) 22%,var(--surface));border-color:var(--c-R);font-weight:700}
.opt.ok::after{content:' ✓'}
.opt.bad{border-style:dashed;text-decoration:line-through;opacity:.8}
.opt.bad::after{content:' ✗'}
.reveal{margin:8px 0;padding:10px 12px;background:var(--surface2);border-radius:10px}
.bigf{display:block;font-size:24px;color:var(--c-R);line-height:1.2;overflow-wrap:anywhere}
:root[data-theme="dark"] .bigf{color:var(--ls)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bigf{color:var(--ls)}}
.fact{display:flex;flex-direction:column;gap:8px;align-items:stretch;border-top:5px solid var(--topic,var(--uv));min-width:0}
.fact>.row{width:100%}
.fact h3{margin:0;font-size:18px;line-height:1.3}
.kp{display:flex;flex-direction:column;gap:2px;padding:8px 10px;background:var(--surface2);border-radius:10px}
.kp b{font-size:28px;line-height:1.1;color:var(--ink2);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
:root[data-theme="dark"] .kp b{color:var(--ls)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kp b{color:var(--ls)}}
.kp span{font-size:13px;color:var(--muted)}
.viz{min-width:0}.ex{margin:0;font-size:14px}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.tile{font:inherit;text-align:left;cursor:pointer;color:var(--ink);background:var(--surface);border:1.5px solid var(--ink2);border-left:8px solid var(--topic);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:26px;line-height:1}.tile span{font-size:13px;color:var(--muted)}
.tile[aria-pressed="true"]{background:var(--surface2);outline:2px solid var(--focus)}
.tile:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.mx{display:grid;gap:4px}.mxr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 10px;background:var(--surface2);border-radius:8px;font-size:14px}
.mxr.h{background:none;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}
.mxr .y,.mxr .n{font-weight:700;padding:2px 10px;border-radius:999px;border:1.5px solid var(--ink2);white-space:nowrap}
.mxr .y{background:color-mix(in srgb,var(--c-R) 25%,var(--surface));border-color:var(--c-R)}
.mxr .n{border-style:dashed;opacity:.85}
.label{font-size:13px;color:var(--muted);margin-bottom:4px}
.sel{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--ink2);border-radius:8px;padding:7px 10px;width:100%;margin:4px 0 8px}
.steps{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:8px}.steps i{font-style:normal;color:var(--c-R);font-weight:700}
.stp{font:inherit;font-size:13px;cursor:pointer;color:var(--ink);background:var(--surface);border:1.5px solid var(--ink2);border-radius:10px;padding:6px 9px;display:flex;gap:6px;align-items:center}
.stp span{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink2);color:#fff;font-size:12px;font-weight:700}
:root[data-theme="dark"] .stp span{background:var(--ls);color:var(--pn)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stp span{background:var(--ls);color:var(--pn)}}
.stp[aria-pressed="true"]{background:var(--surface2);outline:2px solid var(--focus)}
.stp:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.mini3{max-height:300px}
.mini3 .st3{fill:color-mix(in srgb,var(--c-R) 14%,var(--surface2));stroke:var(--ink2);stroke-width:.8;stroke-opacity:.55;vector-effect:non-scaling-stroke}
.mini3 .st3.on{fill:color-mix(in srgb,var(--c-R) 60%,var(--surface2));stroke:var(--focus);stroke-width:1.8;stroke-opacity:1}
.mini3 .st3:focus-visible{stroke:var(--focus);stroke-width:2.6;outline:none}
.hb .brow{cursor:default}
.tg{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1.5px solid var(--ink2);background:var(--surface);color:var(--ink);white-space:nowrap;cursor:help}
.tg-h{background:color-mix(in srgb,var(--c-R) 22%,var(--surface));border-color:var(--c-R)}
.tg-c{background:color-mix(in srgb,var(--uv) 18%,var(--surface));border-color:var(--uv)}
.tg-p{background:var(--surface2);border-style:solid;border-color:var(--ink2)}
.tg-x{background:transparent;border-style:dashed}
.lg4{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.p-a{--pc:var(--muted)}.p-b{--pc:var(--uv)}.p-c{--pc:var(--vr)}
.sw.p-a,.sw.p-b,.sw.p-c{background:var(--pc)}
.tl{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;scroll-snap-type:x proximity}
.tln{font:inherit;text-align:left;cursor:pointer;color:var(--ink);background:var(--surface);border:1.5px solid var(--ink2);border-top:6px solid var(--pc);border-radius:10px;padding:8px 10px;min-width:150px;max-width:170px;display:flex;flex-direction:column;gap:3px;scroll-snap-align:start;flex:0 0 auto}
.tln b{font-size:14px}.tln span{font-size:12.5px;color:var(--muted);line-height:1.3}
.tln.gap{border-style:dashed;border-top-style:solid}
.tln[aria-pressed="true"]{background:var(--surface2);outline:2px solid var(--focus)}
.tln:focus-visible,.blk:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.tld{margin-top:6px;padding:12px 14px;background:var(--surface2);border-radius:12px;border-left:8px solid var(--pc,var(--uv))}
.tld h4{margin:8px 0 4px;font-size:17px}.tld p{margin:6px 0}
.src{font-size:12.5px;color:var(--muted);margin:8px 0 0;overflow-wrap:anywhere}
.chain{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.cr{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.cr1,.cr3{justify-content:center}
.cr2{align-items:center;justify-content:center}
.ar{font-style:normal;font-weight:700;color:var(--ink2);font-size:20px}
.blk{font:inherit;cursor:pointer;color:var(--ink);border:2px solid var(--ink2);border-radius:12px;padding:12px 16px;min-width:130px;text-align:center;background:var(--surface)}
.blk.est{background:var(--ink2);color:#fff}
:root[data-theme="dark"] .blk.est{background:var(--ls);color:var(--pn)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .blk.est{background:var(--ls);color:var(--pn)}}
.blk.comp{border-style:dashed}
.blk.mkt{background:color-mix(in srgb,var(--uv) 20%,var(--surface))}
.blk.top{min-width:min(100%,360px)}
.blk[aria-pressed="true"]{outline:3px solid var(--focus);outline-offset:2px}
.sw.p-res{background:var(--ink2)}.sw.p-comp{background:var(--surface);border:2px dashed var(--ink2)}.sw.p-mkt{background:color-mix(in srgb,var(--uv) 35%,var(--surface));border:1px solid var(--ink2)}
.sw.p-obs{background:var(--uv)}.sw.p-est{background:repeating-linear-gradient(45deg,var(--uv) 0 3px,var(--surface2) 3px 7px);border:1px solid var(--uv)}.sw.p-mk{background:var(--c-F)}
.rb{display:grid;gap:6px;margin:6px 0 10px}
.rbr{display:grid;grid-template-columns:minmax(96px,150px) 1fr auto;gap:8px;align-items:center;font-size:14px}
.rl{color:var(--ink)}.rv{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rt{position:relative;height:18px;background:var(--surface2);border-radius:6px;overflow:visible}
.rt i{display:block;height:100%;background:var(--uv);border-radius:6px 4px 4px 6px}
.rbr.est .rt i{background:repeating-linear-gradient(45deg,var(--uv) 0 4px,var(--surface2) 4px 8px);border:1.5px solid var(--uv)}
.rt u{position:absolute;top:-4px;bottom:-4px;width:0;border-left:3px solid var(--c-F);text-decoration:none}
.cmp th,.cmp td{vertical-align:top;font-size:13.5px}
.cmp thead th.p-a{border-bottom:4px solid var(--muted)}.cmp thead th.p-b{border-bottom:4px solid var(--uv)}.cmp thead th.p-c{border-bottom:4px solid var(--vr)}
.cmp td.none{color:var(--muted);font-style:italic;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--ink2) 8%,transparent) 6px 12px)}
@media (max-width:560px){.rbr{grid-template-columns:84px 1fr auto}.tln{min-width:140px}}
.viz .ex,.viz>.src{margin:10px 0}.viz .legend{margin:8px 0}
</style>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(n,d=0)=>Number(n).toLocaleString('es-MX',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(n,d=1)=>(n>0?'+':n<0?'−':'')+fmt(Math.abs(n),d);
const say=t=>{$('#live').textContent=t};
const D24='Informe Anual 2024 CFE', D22='Informe Anual 2022 CFE';
const GPPD='<a href="https://github.com/wri/global-power-plant-database" target="_blank" rel="noopener">Global Power Plant Database (WRI), CC BY 4.0</a>';
const EXT='<span class="badge b-ext" data-t="Fuente externa: no proviene de los documentos cargados. Se usa solo para ubicar la central y su capacidad instalada; la generación (GWh) siempre viene de los informes de CFE.">Fuente externa</span>';
const TYPES={of:['Oficial','b-of'],ca:['Cálculo','b-ca'],si:['Simulación','b-si'],es:['Estimación','b-es'],co:['Concepto','b-co']};
const bd=(t,x)=>`<span class="badge ${TYPES[t][1]}" data-t="${esc(x||({of:'Dato publicado en un documento oficial cargado.',ca:'Operación aritmética sobre datos oficiales.',si:'Resultado de un modelo con supuestos editables.',es:'Valor inferido con supuestos; no es un dato publicado.',co:'Explicación técnica de apoyo; no es un dato.'})[t])}" tabindex="0">${TYPES[t][0]}</span>`;
const sc=(s,t)=>`<span class="badge b-sc" data-t="${esc(t)}" tabindex="0">${s}</span>`;
const SCOPE={cfe:sc('CFE','Datos exclusivos de la Comisión Federal de Electricidad, sin Productores Independientes de Energía (PIE).'),
 pie:sc('CFE + PIE','CFE más los Productores Independientes de Energía. No es el total nacional.'),
 sen:sc('Nacional (SEN)','Sistema Eléctrico Nacional: todas las centrales interconectadas.'),
 est:sc('Nacional estimado','Total nacional calculado a partir de la participación publicada de CFE. No es un dato publicado.'),
 eps:sc('Por EPS','Datos de una Empresa Productiva Subsidiaria de CFE, no del total de CFE.')};

/* ===== glosario ===== */
const G={
 rankine:{t:'Ciclo termodinámico',x:'Ciclo Rankine: una bomba eleva la presión del agua, una caldera la convierte en vapor, el vapor se expande en una turbina (donde se obtiene la potencia) y un condensador lo regresa a agua. Es la base de las centrales de vapor: carboeléctricas, vapor convencional, nucleoeléctricas y la parte de vapor de un ciclo combinado.'},
 brayton:{t:'Ciclo termodinámico',x:'Ciclo Brayton: un compresor eleva la presión del aire, se quema combustible en una cámara de combustión y los gases calientes se expanden en una turbina de gas. Es el ciclo del turbogás y de la parte de gas de un ciclo combinado.'},
 cc:{t:'Tecnología',x:'Ciclo combinado: une un ciclo Brayton (turbina de gas) con un ciclo Rankine (vapor). Los gases de escape de la turbina de gas, aún calientes, producen vapor en una caldera de recuperación que mueve una segunda turbina. Obtiene más electricidad del mismo combustible que cada ciclo por separado.'},
 vc:{t:'Tecnología',x:'Vapor convencional: una caldera quema combustible para producir vapor que mueve una turbina de vapor (ciclo Rankine). El Informe 2024 indica combustóleo como insumo principal y gas natural como otro insumo.',s:D24+', PDF p. 39 (CFE Generación II)'},
 hrsg:{t:'Equipo',x:'Caldera de recuperación de calor: toma el calor de los gases de escape de una turbina de gas y lo usa para producir vapor, sin quemar más combustible (o con poco).'},
 tg:{t:'Tecnología',x:'Turbogás: turbina de gas con generador, sin ciclo de vapor (ciclo Brayton). Opera con gas natural o con destilados como diésel según el diseño.'},
 ci:{t:'Tecnología',x:'Combustión interna: motores acoplados a un generador; en las tablas del informe aparecen como «Diésel».'},
 carbo:{t:'Tecnología',x:'Carboeléctrica: quema carbón en una caldera para producir vapor (ciclo Rankine). Las unidades duales también usan combustóleo.',s:D24+', PDF p. 39'},
 nuclear:{t:'Tecnología',x:'Nucleoeléctrica: el calor de la fisión del uranio produce vapor que mueve una turbina (ciclo Rankine). No hay combustión.'},
 hid:{t:'Tecnología',x:'Hidroeléctrica: el agua de un embalse o río mueve una turbina hidráulica acoplada a un generador. Su producción depende de la hidrología (lluvias y niveles de embalse).'},
 geo:{t:'Tecnología',x:'Geotermoeléctrica: usa vapor del subsuelo para mover una turbina; no hay combustión.'},
 eol:{t:'Tecnología',x:'Eoloeléctrica: el viento mueve las aspas de un aerogenerador acoplado a un generador.'},
 fv:{t:'Tecnología',x:'Solar fotovoltaica: celdas semiconductoras convierten la luz en corriente continua; un inversor la pasa a alterna.'},
 eps:{t:'Término',x:'EPS: Empresa Productiva Subsidiaria de CFE. Las centrales de generación de CFE están agrupadas en las EPS CFE Generación I a VI. En los informes cada EPS reporta sus propias centrales. El nombre de la EPS no indica la ubicación de la central.'},

const tip=(k,l)=>`<span class="tip" tabindex="0" data-g="${k}">${l}</span>`;
const tt=$('#tooltip');let ttFor=null;
function showTip(el){let h='';
 if(el.dataset.g){const g=G[el.dataset.g];if(!g)return;h=`<div class="tt-t">${g.t}</div>${esc(g.x)}${g.s?`<div class="tt-s">Fuente: ${esc(g.s)}</div>`:''}`}
 else if(el.dataset.t){h=esc(el.dataset.t)}else return;
 tt.innerHTML=h;tt.hidden=false;ttFor=el;el.setAttribute('aria-describedby','tooltip');
 const r=el.getBoundingClientRect(),w=tt.offsetWidth,hh=tt.offsetHeight;
 let x=Math.min(Math.max(12,r.left+r.width/2-w/2),innerWidth-w-12),y=r.bottom+8;if(y+hh>innerHeight-8)y=Math.max(8,r.top-hh-8);
 tt.style.left=x+'px';tt.style.top=y+'px'}
function hideTip(){if(ttFor)ttFor.removeAttribute('aria-describedby');tt.hidden=true;ttFor=null}
const tipEl=e=>e.target.closest&&e.target.closest('[data-g],[data-t]');
document.addEventListener('mouseover',e=>{const el=tipEl(e);if(el&&el!==ttFor)showTip(el)});
document.addEventListener('mouseout',e=>{const el=tipEl(e);if(el&&!el.contains(e.relatedTarget))hideTip()});
document.addEventListener('focusin',e=>{const el=tipEl(e);if(el)showTip(el)});
document.addEventListener('focusout',e=>{if(tipEl(e))hideTip()});
document.addEventListener('click',e=>{const el=tipEl(e);if(el&&!el.matches('button,a,[data-k],[data-sys]')){ttFor===el&&!tt.hidden?hideTip():showTip(el)}else if(!el)hideTip()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});
addEventListener('scroll',hideTip,{passive:true});

function bars(rows,max){return rows.map(r=>`<div class="brow ${r.dim?'dim':''}" tabindex="0" data-t="${esc(r.tip||'')}"><div class="bl">${r.g?tip(r.g,esc(r.k)):esc(r.k)}</div><div class="bt ${r.b2!=null?'two':''}">${r.b2!=null?`<div class="bf prev c-${r.cat}" style="width:${100*r.b2/max}%"></div>`:''}<div class="bf c-${r.cat}" style="width:${Math.max(.6,100*r.b/max)}%"></div></div><div class="bv">${r.txt}</div></div>`).join('')}
function divbars(rows,max){return rows.map(r=>{const w=Math.min(50,50*Math.abs(r.v)/max);return `<div class="brow ${r.dim?'dim':''}" tabindex="0" data-t="${esc(r.tip||'')}"><div class="bl">${r.g?tip(r.g,esc(r.k)):esc(r.k)}</div><div class="dt"><div class="dz"></div><div class="db c-${r.cat}" style="${r.v<0?`right:50%`:`left:50%`};width:${w}%"></div></div><div class="bv">${sgn(r.v)} %</div></div>`}).join('')}
const legend=()=>`<div class="legend"><span><i class="sw c-F"></i>Fósil</span><span><i class="sw c-N"></i>Nuclear (rayado)</span><span><i class="sw c-R"></i>Renovable</span></div>`;
function stack(items){const t=items.reduce((s,i)=>s+i.v,0);return `<div class="stack">${items.map(i=>`<div class="seg ${i.cls}" style="flex:${i.v} 1 0" data-t="${esc(i.tip||i.l)}" tabindex="0">${100*i.v/t>=7?i.l:''}</div>`).join('')}</div>`}

const hb=(rows,max)=>`<div class="hb">${bars(rows,max)}</div>`;
const legCat=()=>`<div class="legend"><span><i class="sw c-F"></i>Fósil</span><span><i class="sw c-N"></i>Nuclear (rayado)</span><span><i class="sw c-R"></i>Renovable</span></div>`;
const pc=(x,d=1)=>fmt(x,d)+' %';

/* ===== HALLAZGOS ===== */
const FS=[];
const add=f=>FS.push(f);

// ---------- RECURSOS ENERGÉTICOS ----------
add({id:'r1',th:'rec',q:'¿Qué porcentaje de la electricidad mexicana se genera con combustibles fósiles?',k:['68.8 %','de la generación del SEN en 2022 fue fósil (31.2 % limpia)'],t:['of'],
 x:'En 2022 el SEN generó 340,713 GWh. La mayor parte vino del ciclo combinado (gas natural). En CFE, en 2024, la parte fósil fue aún mayor: 74.7 % de su generación bruta (cálculo con la suma de sus tecnologías fósiles).',
 src:PRS+', PDF p. 11 (p. impresa 59), año 2022; '+D24+', PDF p. 29, año 2024 (cálculo)',
 viz(){const nac=V.r1==='nac';
  const rows=nac?NAC.map(([k,v,c])=>({k,cat:c==='L'?'R':c,b:v,txt:fmt(v,1)+' %',tip:`${k}: ${fmt(v,1)} % de la generación del SEN en 2022.`})):GEN.map(g=>({k:g.k,cat:g.cat,b:100*g.b/GT24,txt:fmt(100*g.b/GT24,1)+' %',tip:`${g.k}: ${fmt(g.b)} GWh, ${fmt(100*g.b/GT24,1)} % de la generación bruta de CFE en 2024.`}));
  const f=nac?68.8:100*GEN.filter(g=>g.cat==='F').reduce((s,g)=>s+g.b,0)/GT24,n=nac?0:100*12307/GT24,r=nac?31.2:100*GEN.filter(g=>g.cat==='R').reduce((s,g)=>s+g.b,0)/GT24;
  return seg('r1',[['nac','México 2022 (SEN)'],['cfe','CFE 2024']])+stack([{v:f,cls:'c-F',l:'Fósil '+fmt(f,1)+' %',tip:'Fósil: '+fmt(f,1)+' %'}].concat(n?[{v:n,cls:'c-N',l:'Nuclear '+fmt(n,1)+' %',tip:'Nuclear: '+fmt(n,1)+' %'}]:[]).concat([{v:r,cls:'c-R',l:(nac?'Limpia ':'Renovable ')+fmt(r,1)+' %',tip:(nac?'Energías limpias: ':'Renovable: ')+fmt(r,1)+' %'}]))+`<div style="margin-top:8px">${hb(rows,Math.max(...rows.map(x=>x.b)))}</div>${legCat()}<div class="note" style="margin-top:6px">${nac?'Los rótulos de la figura suman 69.0 % fósil; el texto da 68.8 % y 31.2 % (metodología CRE A/018/2023). «Cogeneración eficiente» y «Otros limpios» se cuentan como limpias.':'CFE no es todo el país: produjo 42.3 % de la generación en 2024 (Informe 2024, PDF p. 31).'}</div>`}});

add({id:'r2',th:'rec',q:'¿Cuánto CO₂ evitan las energías limpias de CFE? (y qué falta para comparar emisiones por kWh)',k:['18.6 Mt','de CO₂ evitadas en 2024 según cuatro filiales de generación de CFE'],t:['of','ca'],
 x:'Cada filial calcula cuánto CO₂ se habría emitido si esa energía limpia se hubiera generado con tecnología fósil. La suma (cálculo) es de 18,594,021 t. Es una cifra de CFE, de cuatro de sus filiales; no cubre todo el país ni todas las tecnologías.',
 src:D24+', año 2024, PDF p. 35, 39, 44 y 63; suma: cálculo',
 viz(){return hb(EVI.map(([k,v,d,p])=>({k,cat:'R',b:v,txt:fmt(v/1e6,2)+' Mt',tip:`${k}: ${fmt(v)} t de CO₂ evitadas. ${d}. Informe 2024, PDF p. ${p}.`})),8e6)+`<div class="callout"><b>Falta una fuente:</b> los documentos cargados no traen factores de emisión por tecnología (g CO₂e/kWh), ni directos ni de ciclo de vida. Por eso no hay un comparador de tecnologías. Para hacerlo, carga una tabla con esos factores (por ejemplo, el Anexo III del Quinto Informe del IPCC, Grupo de Trabajo III, o el factor de emisión del SEN) y la incorporo separando emisiones directas y de ciclo de vida.</div>`}});

add({id:'r3',th:'rec',q:'¿Por qué la energía nuclear puede considerarse limpia, pero no renovable?',k:['8.0 %','de la generación bruta de CFE en 2024 fue nuclear (12,307 GWh)'],t:['of','co'],
 x:'La ley define las energías limpias con una lista que incluye la nucleoeléctrica. En cambio, la lista de energías renovables (viento, sol, agua, calor de la Tierra, biocombustibles) no la incluye. Elige una fuente para ver cómo la clasifican las definiciones.',
 src:LSEd+', art. 3, PDF p. 3; '+LPTEd+', art. 3, PDF p. 192 del archivo; '+D24+', PDF p. 29',
 viz(){const T=[['gas','Gas natural',[0,0,1]],['carbon','Carbón y combustóleo',[0,0,1]],['uranio','Uranio (nuclear)',[1,0,0]],['agua','Agua (hidráulica)',[1,1,0]],['viento','Viento',[1,1,0]],['sol','Radiación solar',[1,1,0]],['geo','Calor geotérmico',[1,1,0]]];
  const t=T.find(x=>x[0]===V.r3)||T[2],[,n,m]=t;const ic=(ok)=>ok?'✓ Sí':'✗ No';
  const lim=['No está en la lista de energías limpias.','Sí aparece en la lista de energías limpias.'],ren=['No está en la lista de energías renovables.','Sí aparece en la lista de energías renovables.'],fo=['No se define como fósil.','Es fósil: proviene de la combustión de sustancias con carbono formadas por procesos geológicos.'];
  return `<div class="row" role="group" aria-label="Fuente de energía" style="margin:4px 0 8px">${T.map(x=>`<button class="chip" data-vz="r3" data-v="${x[0]}" aria-pressed="${V.r3===x[0]}">${x[1]}</button>`).join('')}</div>
  <div class="mx" role="table" aria-label="Clasificación de ${esc(n)}"><div class="mxr h"><span>Definición</span><span>¿Cumple?</span></div>
   <div class="mxr"><span>Energía limpia (LSE)</span><span class="${m[0]?'y':'n'}" data-t="${lim[m[0]]}" tabindex="0">${ic(m[0])}</span></div>
   <div class="mxr"><span>Energía renovable (LPTE)</span><span class="${m[1]?'y':'n'}" data-t="${ren[m[1]]}" tabindex="0">${ic(m[1])}</span></div>
   <div class="mxr"><span>Energía fósil (LPTE)</span><span class="${m[2]?'y':'n'}" data-t="${fo[m[2]]}" tabindex="0">${ic(m[2])}</span></div></div>
  <div class="note" style="margin-top:8px">${V.r3==='uranio'?'Esta es la única fuente de la lista que es limpia pero no renovable. La ley define renovable por su fuente (fenómenos de la naturaleza que se regeneran) y limpia por sus emisiones; la nuclear no emite por combustión, pero no está en la lista de renovables.':esc(m[2]?'Los fósiles no están en la lista de limpias.':'Está en las dos listas: es limpia y renovable.')}</div>`}});

add({id:'r4',th:'rec',q:'¿Qué participación tienen la energía solar, eólica, hidráulica y geotérmica en la generación renovable?',k:['43.9 %','de la generación renovable (de esas cuatro) fue hidráulica en México en 2022'],t:['of','ca'],
 x:'En el país (2022) la hidráulica pesa 44 %, y la eólica y la solar un cuarto cada una. En CFE (2024) la hidráulica pesa 84 % y la solar y la eólica casi nada: la mayor parte de la solar y la eólica no es de CFE. Participación calculada con la suma de las cuatro fuentes.',
 src:PRS+', PDF p. 11, año 2022; '+D24+', PDF p. 29, año 2024; cálculo',
 viz(){const nac=V.r4==='nac';const R=nac?[['Hidráulica',10.4],['Eoloeléctrica',6.0],['Solar fotovoltaica',6.0],['Geotérmica',1.3]]:[['Hidroeléctrica',22354],['Geotermoeléctrica',3692],['Solar fotovoltaica',555],['Eoloeléctrica',75]];
  const s=R.reduce((a,x)=>a+x[1],0),sh=[1,.72,.5,.3];
  return seg('r4',[['nac','México 2022'],['cfe','CFE 2024']])+`<div class="stack">${R.map((x,i)=>`<div class="seg" style="flex:${x[1]} 1 0;background:color-mix(in srgb,var(--c-R) ${sh[i]*100}%,var(--surface));color:var(--ink);border:1px solid var(--c-R)" data-t="${esc(x[0])}: ${fmt(100*x[1]/s,1)} % de la generación renovable de esas cuatro fuentes" tabindex="0">${100*x[1]/s>=9?fmt(100*x[1]/s,1)+' %':''}</div>`).join('')}</div>
  <div class="legend" style="margin-top:6px">${R.map((x,i)=>`<span><i class="sw" style="background:color-mix(in srgb,var(--c-R) ${sh[i]*100}%,var(--surface));border:1px solid var(--c-R)"></i>${x[0]} · ${fmt(100*x[1]/s,1)} %</span>`).join('')}</div>
  <div class="note" style="margin-top:6px">${nac?'Datos: 10.4 %, 6.0 %, 6.0 % y 1.3 % de la generación total del SEN (suman 23.7 %). Se excluyen bioenergía (0.6 %) y otras limpias.':'Datos: 22,354, 3,692, 555 y 75 GWh brutos de CFE (suman 26,676 GWh). No incluye a los productores privados.'}</div>`}});

add({id:'r5',th:'rec',q:'¿Qué recursos dependen del clima y cuáles permiten una generación controlable?',k:['−34.4 %','cayó la generación hidroeléctrica de CFE entre 2022 y 2024 (el clima mueve la hidráulica)'],t:['of','ca','co'],
 x:'Sol, viento y agua dependen de lo que ofrezca el clima. Los combustibles (gas, carbón, uranio) permiten programar la generación. El PRODESEN menciona la necesidad de respaldar las renovables intermitentes y dice que los ciclos combinados y la combustión interna dan más flexibilidad. La barra muestra cuánto cambió la generación de CFE entre 2023 y 2024.',
 src:PRS+', PDF p. 10; '+D24+', años 2023-2024, PDF p. 29; hidroeléctricas 2022-2024 (cálculo): '+D22+', PDF p. 50, 57, 71-72, 109 y '+D24+', PDF p. 35, 40, 44-45, 49, 63',
 viz(){const W={'Solar fotovoltaica':1,'Eoloeléctrica':1,'Hidroeléctrica':1};
  const list=GEN.filter(g=>g.k!=='Turbojet').filter(g=>V.r5==='all'||(V.r5==='clima'?W[g.k]:!W[g.k]));
  return seg('r5',[['all','Todas'],['clima','Dependen del clima'],['ctrl','Controlables']])+divbars(list.map(g=>({k:g.k,cat:g.cat,v:g.v,tip:`${g.k}: ${sgn(g.v)} % entre 2023 y 2024 (${fmt(g.a)} → ${fmt(g.b)} GWh). ${W[g.k]?'Depende del clima.':'Se alimenta de un combustible o de calor que se puede administrar.'}`})),110)+legCat()+`<div class="note" style="margin-top:6px">«Dependen del clima» es una clasificación técnica (concepto), no un dato del informe. La solar subió 102.6 % porque CFE puso en operación nueva capacidad, no por el clima. Geotermia: depende del yacimiento, no del clima, y bajó 14.6 %.</div>`}});

// ---------- GENERACIÓN ----------
add({id:'g1',th:'gen',q:'¿Qué tecnología produce más electricidad en México?',k:['55.1 %','de la generación del SEN en 2022 fue de ciclo combinado'],t:['of'],
 x:'El ciclo combinado, que quema gas natural, es la primera tecnología tanto en el país como en CFE (61,490 GWh brutos en 2024, 39.9 % de la generación de CFE). Es una tecnología fósil.',
 src:PRS+', PDF p. 11, año 2022; '+D24+', PDF p. 29, años 2023 y 2024',
 viz(){const y=V.g1;const rows=[...GEN].sort((a,b)=>b[y]-a[y]).map(g=>({k:g.k,cat:g.cat,b:g[y],txt:fmt(g[y])+' GWh',tip:`${g.k}: ${fmt(g[y])} GWh brutos en ${y==='b'?2024:2023} (${fmt(100*g[y]/(y==='b'?GT24:GT23),1)} % de CFE).`}));
  return seg('g1',[['a','CFE 2023'],['b','CFE 2024']])+hb(rows,rows[0].b)+legCat()+`<div class="src">Total CFE: ${fmt(y==='b'?GT24:GT23)} GWh brutos.</div>`}});

add({id:'g2',th:'gen',q:'¿Cuál es la central eléctrica de mayor capacidad instalada?',k:['Chicoasén','Manuel Moreno Torres: 2,400 MW (fuente externa, GPPD 2016) y 3,337.8 GWh netos en 2024'],t:['of','ext'],
 x:'Entre las 70 centrales con tabla propia en los informes de CFE, la mayor generación neta de 2024 fue la hidroeléctrica Chicoasén, y la mayor capacidad también según la base externa GPPD (2016). No se comparó con centrales privadas ni con ciclos combinados sin tabla propia. El MW de Cerro Prieto en GPPD (1 MW) parece un error de esa base y no se usa.',
 src:D24+', año 2024, generación neta por central (PDF p. 35, 40, 44, 63); capacidad: Global Power Plant Database (WRI, 2016), fuente externa',
 viz(){const g=V.g2==='gen';const rows=TOPC.map(c=>({k:c[0].replace(/ \(.*\)/,''),cat:'R',b:g?c[2]:(c[4]&&c[0]!=='Cerro Prieto'?c[4]:0),txt:g?fmt(c[2],1)+' GWh':(c[4]&&c[0]!=='Cerro Prieto'?fmt(c[4])+' MW':'sin dato fiable'),tip:g?`${c[0]}: ${fmt(c[2],1)} GWh netos en 2024 (Informe 2024, PDF p. ${c[3]}).`:`${c[0]}: ${c[4]&&c[0]!=='Cerro Prieto'?fmt(c[4])+' MW según GPPD ('+c[5]+'), fuente externa.':'sin dato confiable de capacidad.'}`}));
  return seg('g2',[['gen','Generación neta 2024'],['cap','Capacidad (externa)']])+hb(rows,g?3400:2400)+`<div class="src">Las ocho centrales con mayor generación neta de las 70 con tabla. ${g?'':'Capacidad: GPPD 2016 (externa).'}</div>`}});

add({id:'g3',th:'gen',q:'¿Cuánta electricidad produce una central nuclear?',k:['12,307 GWh','generó la nucleoeléctrica (Laguna Verde) en 2024, con 1,608 MW efectivos'],t:['of','ca'],
 x:'Con 1,608 MW produjo 12,307 GWh brutos, 8.0 % de la generación de CFE con 3.6 % de su capacidad (1,608 de 45,116.6 MW efectivos). Dividir entre las horas del año da un factor de uso de 87.1 %, el más alto de la tabla. Es un cálculo propio con capacidad efectiva, no el factor de planta que publica CFE (38.5 % para todo CFE).',
 src:D24+', año 2024, PDF p. 26, 29 y 66; factor: cálculo (GWh ÷ (MW × 8,784 h))',
 viz(){const rows=GEN.filter(g=>g.c2).map(g=>({k:g.k,cat:g.cat,b:100*g.b/(g.c2*HRS24/1000),txt:fmt(100*g.b/(g.c2*HRS24/1000),1)+' %',tip:`${g.k}: ${fmt(g.b)} GWh en ${fmt(g.c2,1)} MW efectivos → ${fmt(100*g.b/(g.c2*HRS24/1000),1)} % de uso.`})).sort((a,b)=>b.b-a.b);
  return `<div class="label">Factor de uso implícito 2024 (generación ÷ capacidad × horas)</div>`+hb(rows,100)+legCat()+`<div class="note" style="margin-top:6px">La solar queda baja porque su capacidad se amplió durante el año (126 → 433 MW) y el cálculo usa la capacidad al cierre.</div>`}});

add({id:'g4',th:'gen',q:'¿Cómo ha evolucionado la generación solar y eólica?',k:['+102.6 %','creció la generación solar de CFE en 2024 (274 → 555 GWh); la eólica bajó 12.8 %'],t:['of'],
 x:'La solar de CFE duplicó su generación porque su capacidad pasó de 126 a 433 MW. La eólica de CFE es pequeña (85.7 MW). En todo el país, la solar y la eólica pesaron 6.0 % cada una en 2022 (PRODESEN), así que la mayor parte no es de CFE.',
 src:D24+', años 2023-2024, PDF p. 26 y 29; '+PRS+', PDF p. 11, año 2022',
 viz(){const g=V.g4==='gen';const S=GEN.filter(x=>x.k==='Solar fotovoltaica'||x.k==='Eoloeléctrica');
  const rows=S.map(x=>({k:x.k,cat:'R',b:g?x.b:x.c2,b2:g?x.a:x.c1,txt:g?fmt(x.a)+' → '+fmt(x.b)+' GWh':fmt(x.c1,1)+' → '+fmt(x.c2,1)+' MW',tip:`${x.k}: ${g?fmt(x.a)+' GWh (2023) → '+fmt(x.b)+' GWh (2024)':fmt(x.c1,1)+' MW → '+fmt(x.c2,1)+' MW efectivos'}.`}));
  return seg('g4',[['gen','Generación (GWh)'],['cap','Capacidad (MW)']])+hb(rows,g?600:450)+`<div class="legend"><span><i class="sw c-R" style="opacity:.45"></i>2023</span><span><i class="sw c-R"></i>2024</span></div><div class="note" style="margin-top:6px">Solo hay dato de CFE para 2023 y 2024 en este módulo. Los contratos de interconexión legados que CFE administra suman 4,370 MW eólicos y 580 MW fotovoltaicos (${D24}, PDF p. 75), pero no son generación de CFE.</div>`}});

add({id:'g5',th:'gen',q:'¿Cuántos hogares podrían abastecerse teóricamente con la energía anual de una central?',k:['≈ 6.9 M','hogares con la energía anual de Laguna Verde, si cada uno consume lo que el usuario doméstico promedio'],t:['of','ca'],
 x:'Se divide la energía anual de la central entre el consumo anual de un usuario doméstico (ventas domésticas 2024 ÷ usuarios domésticos: unos 1,790 kWh al año). Es un cálculo teórico: ignora pérdidas, la hora en que se genera la energía y que la central abastece a toda la red. Cambia el consumo por hogar con el deslizador.',
 src:D24+', año 2024, ventas domésticas PDF p. 123; usuarios PDF p. 122; generación PDF p. 29 y 63; cálculo',
 viz(){const o=`<label class="note" for="g5sel">Central</label><select id="g5sel" class="sel" data-sel="g5"><option value="0" ${V.g5==0?'selected':''}>Laguna Verde (nuclear), 12,307 GWh brutos</option>${TOPC.slice(0,4).map((c,i)=>`<option value="${i+1}" ${V.g5==i+1?'selected':''}>${esc(c[0])}, ${fmt(c[2],1)} GWh netos</option>`).join('')}</select>`;
  return o+sld('g5s','k','Consumo anual por hogar (kWh)',500,5000,10,V.g5s.k)+`<div data-out="g5">${this.out()}</div>`},
 out(){const gw=V.g5==0?12307:TOPC[V.g5-1][2],h=gw*1e6/V.g5s.k;return `<div class="res">${kpi(fmt(h/1e6,2)+' M','Hogares abastecidos (teórico)','millones')}${kpi(fmt(100*h/(CLI24),1)+' %','Parte de los 49.0 M de clientes (comparación orientativa)','cálculo')}</div><div class="src">${fmt(gw,1)} GWh ÷ ${fmt(V.g5s.k)} kWh por hogar. Referencia: usuario doméstico promedio 2024 ≈ ${fmt(KWH_HOGAR)} kWh/año.</div>`}});

// ---------- TRANSMISIÓN ----------
add({id:'t1',th:'tra',q:'¿Cuántos kilómetros tiene la red nacional de transmisión?',k:['111,138 km','de líneas de 69 a 400 kV en 2024, con 2,317 subestaciones'],t:['of'],
 x:'La Red Nacional de Transmisión creció 0.72 % entre 2021 y 2024 (+791 km). Las subestaciones pasaron de 2,275 a 2,317 y la capacidad de transformación de 165,804 a 168,981 MVA.',
 src:D24+', años 2022-2024, PDF p. 79; '+D22+', año 2021, PDF p. 125',
 viz(){const m=V.t1,u={km:'km',sub:'subestaciones',mva:'MVA'}[m],yrs=[2021,2022,2023,2024];const base=TRN[m][2021];
  return seg('t1',[['km','Longitud (km)'],['sub','Subestaciones'],['mva','Capacidad (MVA)']])+hb(yrs.map(y=>({k:String(y),cat:'R',b:TRN[m][y],txt:fmt(TRN[m][y]),tip:`${y}: ${fmt(TRN[m][y])} ${u}. ${y>2021?sgn(100*(TRN[m][y]/base-1),2)+' % frente a 2021.':'Año base.'}`})),Math.max(...yrs.map(y=>TRN[m][y])))+`<div class="src">Variación 2021→2024: ${sgn(100*(TRN[m][2024]/base-1),2)} % (cálculo). Barras desde cero: los cambios son pequeños.</div>`}});

add({id:'t2',th:'tra',q:'¿Por qué se utilizan líneas de 400 kV?',k:['−42.5 %','de corriente a 400 kV frente a 230 kV, para la misma potencia (cálculo)'],t:['si','co'],
 x:'Para transportar la misma potencia, una tensión mayor significa menos corriente: I = P / (√3 · V · cos φ). Menos corriente permite conductores menos gruesos y menos pérdidas. Los documentos nombran proyectos de 115, 161, 230 y 400 kV y dicen que la RNT es de 69 a 400 kV; no explican por qué eligen 400 kV, eso es un cálculo con la fórmula.',
 src:D24+', PDF p. 93 (niveles de la RNT); '+PRS+' (proyectos en 115, 161, 230 y 400 kV); cálculo con I = P/(√3·V·cos φ), cos φ = 1',
 viz(){return sld('t2','P','Potencia a transportar P (MW)',10,1000,10,V.t2.P)+`<div data-out="t2">${this.out()}</div>`},
 out(){const P=V.t2.P,L=[69,115,161,230,400],I=v=>P*1e6/(Math.sqrt(3)*v*1e3);const mx=I(69);
  return hb(L.map(v=>({k:v+' kV',cat:'R',b:I(v),txt:fmt(I(v),0)+' A',tip:`A ${v} kV, ${fmt(P)} MW requieren ${fmt(I(v),0)} A por línea (cos φ = 1).`})),mx)+`<div class="src">Simulación con P = ${fmt(P)} MW y factor de potencia 1. Los niveles 69, 115, 161, 230 y 400 kV aparecen en los informes; la lista no es completa.</div>`}});

add({id:'t3',th:'tra',q:'¿Qué sistemas eléctricos no están conectados al Sistema Interconectado Nacional?',k:['3','sistemas descritos como aislados: Baja California, Baja California Sur y Mulegé'],t:['of','co'],
 x:'Los informes llaman «aislado» a Baja California y a Baja California Sur, y también al sistema de Guerrero Negro, en Mulegé. Los documentos no describen enlaces entre sistemas. La asignación de estados a cada sistema es inferida del nombre.',
 src:D22+', año 2022, PDF p. 9, 37 y 219; '+PRS+', PDF p. 14; límites estatales: GitHub angelnmara/geojson (fuente externa)',

function repHtml(){
 return `<div class="card"><h3>Cinco repercusiones, con cifras</h3>
 <div class="steps" role="group" aria-label="Repercusión">${RPS.map(([k,l])=>`<button class="stp" data-rf="rp" data-v="${k}" aria-pressed="${RF.rp===k}">${l}</button>`).join('')}</div>
 <div class="viz">${rpBody[RF.rp]()}</div></div>
 <div class="callout"><b>Correlación no es causalidad.</b> Los números de esta sección muestran qué pasó en esos años, no qué lo causó. Pueden haber influido otros factores (demanda, combustibles, otras políticas), y los documentos cargados no traen un análisis que aísle el efecto de la reforma.</div>`;
}

/* --- 4. comparación histórica --- */
const CMP=[
 ['Generación privada',
  {leg:'LSPEE 1992: cuatro esquemas (autoabasto, cogeneración, pequeña producción, producción independiente). [CFE, PDF 7]',obj:'Sin documento.',res:'Autoabasto privado ~20 % de la energía consumida en 2020 (CFE). [PDF 140]'},
  {leg:'LIE art. 4: generación y comercialización en «libre competencia». [PDF 48]',obj:'Decreto: apoyar e impulsar a empresas sociales y privadas. [PDF 1]',res:'Capacidad total +34.8 % en 2016-2022. [PRODESEN, PDF 5]'},
  {leg:'LSE art. 4: competencia «sin prevalencia para los particulares». [PDF 7]',obj:'LSE: reconocer la prevalencia del Estado. [PDF 1-2]',res:'Sin cifras posteriores a 2024 en los documentos.'}],
 ['Naturaleza de CFE',
  {leg:'Organismo descentralizado (según el decreto, Transitorio Tercero). [PDF 3]',obj:'Sin documento.',res:'CFE: 53 % de generación a fines de 2018. [PDF 7]'},
  {leg:'Empresa productiva del Estado; fin: «valor económico y rentabilidad». [PDF 219]',obj:'Decreto: conversión en máximo dos años. [PDF 3]',res:'CFE: 41.1-42.3 % en 2022-2024 (base no comparable). [PDF 31]'},
  {leg:'«Empresa Pública del Estado». [LSE, PDF 3]',obj:'Mantener al menos 54 % de la energía inyectada. [PDF 15]',res:'Cumplimiento aún no medible con los documentos.'}],
 ['Mercado y operación',
  {leg:'Sin documento cargado.',obj:'Sin documento.',res:'Sin documento.'},
  {leg:'MEM operado por el CENACE; acceso abierto. [PDF 46, 54]',obj:'Decreto: acceso abierto y no indebidamente discriminatorio. [PDF 8]',res:'CFE Calificados: 73 contratos, 34 empresas (2024). [CFE, PDF 140]'},
  {leg:'LSE conserva el MEM con despacho económico de carga. [PDF 5, 15]',obj:'Operar con costos de producción y continuidad. [PDF 8]',res:'Sin cifras de mercado en los documentos.'}],
 ['Transmisión y distribución',
  {leg:'Sin documento cargado.',obj:'Sin documento.',res:'Sin documento.'},
  {leg:'Exclusivas de la Nación; sin concesiones; contratos permitidos. [DOF 2013, PDF 1]',obj:'Separación legal de actividades. [PDF 49]',res:'Ver Módulos 2 y 3 (cifras 2022-2024).'},
  {leg:'Siguen como actividades del Estado. [LSE, PDF 2]',obj:'Programas vinculantes autorizados por SENER. [PDF 10]',res:'Ver Módulos 2 y 3.'}],
 ['Planeación',
  {leg:'POISE, elaborado por CFE (descrito por CFE). [PDF 192]',obj:'Sin documento.',res:'Sin documento.'},
  {leg:'PRODESEN, elaborado por SENER. [LIE, PDF 50]',obj:'Planeación integral del sector. [LIE]',res:'Capacidad esperada al 2037: 157,098 MW. [PRODESEN, PDF 3]'},
  {leg:'Planeación vinculante autorizada por SENER. [LSE, PDF 10, 19]',obj:'Seguridad nacional y justicia energética. [LSE, PDF 15]',res:'Sin cifras posteriores en los documentos.'}]];
function cmpHtml(){
 const L={leg:'Cambios legales (qué dice la ley)',obj:'Objetivos declarados (qué buscaba)',res:'Resultados observados (qué cifras hay)'};
 return `<div class="card"><h3>Tres momentos del marco jurídico</h3>${rfs('cl',Object.entries(L))}
 <div class="tbls" style="max-height:none"><table class="cmp" style="min-width:760px"><thead><tr><th>Tema</th><th class="p-a">Antes de 2013</th><th class="p-b">Reforma 2013 y leyes 2014</th><th class="p-c">Modificaciones 2024-2025</th></tr></thead><tbody>
 ${CMP.map(r=>`<tr><th scope="row">${r[0]}</th>${[1,2,3].map(i=>{const t=r[i][RF.cl];return `<td class="${t.startsWith('Sin ')?'none':''}">${esc(t)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>
 <p class="ex">Las siglas entre corchetes indican la fuente y la página del PDF cargado. «Sin documento» significa que no hay fuente cargada, no que no exista el dato.</p></div>
 <div class="grid g2"><div class="card alt"><h3>La ley vigente puede diferir de la de 2013-2014</h3><p class="ex">La Ley de la Industria Eléctrica de 2014 fue abrogada por la Ley del Sector Eléctrico de 2025 (PDF p. 52). Algunos cambios dependen todavía de reglamentos y de actualizaciones de normas posteriores, y la propia ley menciona una reforma constitucional del 31 de octubre de 2024 cuyo texto no está cargado. Antes de usar un artículo como vigente, hay que revisar la versión actual.</p></div>
 <div class="card alt"><h3>Cómo se distinguen aquí los tres niveles</h3><ul class="ex"><li><b>Objetivo declarado:</b> lo que dice un texto que busca lograr.</li><li><b>Cambio legal:</b> lo que dispone la ley.</li><li><b>Resultado observado:</b> una cifra publicada, sin asumir que la causó la reforma.</li></ul></div></div>
 <div class="card"><h3>Dos lecturas del proceso, con sus fuentes</h3><div class="grid g2">
 <div class="mxr" style="grid-template-columns:1fr"><span>${tg('p')} <b>Informe Anual 2024 de CFE.</b> Presenta la reforma de 2013 como causa de pérdida de participación y de capacidad de inversión de CFE, y su estrategia posterior como «rescate». (PDF p. 7 y 192)</span></div>
 <div class="mxr" style="grid-template-columns:1fr"><span>${tg('p')} <b>PRODESEN 2023-2037 de SENER.</b> Destaca que la capacidad creció 19.4 % de 2018 a 2022 frente a 7 % del consumo y que la planeación «ha sabido anticiparse». (PDF p. 5)</span></div></div>
 <p class="ex">Las dos son voces oficiales de dependencias del Estado. No son análisis independientes ni recogen la postura de partidos, empresas, académicos u organismos de consumidores. Para presentar un panorama equilibrado hace falta cargar esas fuentes (ver Ojo con los datos).</p></div>`;
}

function pReforma(){
 const subs=[['ctx','1 · Contexto político y legislativo'],['est','2 · Cambios estructurales'],['rep','3 · Repercusiones'],['cmp','4 · Comparación histórica']];
 const body={ctx:tlHtml,est:estHtml,rep:repHtml,cmp:cmpHtml}[RF.s]();
 return `<div><h2>La reforma energética de 2013: ¿cómo cambió el sector eléctrico mexicano?</h2><p class="lead">Un recorrido por lo que dicen los textos legales, las cifras publicadas y las distintas lecturas. Cada afirmación lleva una etiqueta para separar hechos, cifras y opiniones.</p></div>
 <div class="legend lg4">${['h','c','p','x'].map(k=>`<span>${tg(k)}</span>`).join('')}</div>
 <div class="steps" role="tablist" aria-label="Secciones de la reforma">${subs.map(([k,l])=>`<button class="stp" role="tab" data-rf="s" data-v="${k}" aria-pressed="${RF.s===k}" aria-selected="${RF.s===k}">${l}</button>`).join('')}</div>
 <div id="rfBody">${body}</div>`;
}
function bindRf(){
 $$('[data-rf]').forEach(b=>b.onclick=()=>{const k=b.dataset.rf,v=b.dataset.v;RF[k]=/^\d+$/.test(v)?+v:v;if(k==='s')hideTip();renderAll();const n=$(`[data-rf="${k}"][data-v="${v}"]`);if(n)n.focus({preventScroll:true})});
}

const TABS=[['datos','Hallazgos',pDatos],['reforma','La reforma de 2013',pReforma],['quiz','Pon a prueba',pQuiz],['verificar','Ojo con los datos',pVer]];
function renderAll(){
 const act=TABS.find(t=>$('#t-'+t[0]).getAttribute('aria-selected')==='true')||TABS[0];
 const s=$('#p-'+act[0]);s.innerHTML=act[2]();bind();
}
function rv(id){const f=FS.find(x=>x.id===id),e=$('#viz_'+id);if(f&&e){e.innerHTML=f.viz();}}
function bind(){
 bindRf();
 $$('[data-vz]').forEach(b=>b.onclick=()=>{const id=b.dataset.vz,k=b.dataset.v;V[id]=/^\d+$/.test(k)?+k:k;rv(id);bind();const n=$(`[data-vz="${id}"][data-v="${k}"]`);if(n)n.focus({preventScroll:true})});
 $$('select[data-sel]').forEach(s=>s.onchange=()=>{V[s.dataset.sel]=+s.value;const id=s.dataset.sel,f=FS.find(x=>x.id===id),o=$(`[data-out="${id}"]`);if(o)o.innerHTML=f.out()});
 $$('input[data-sl]').forEach(i=>i.oninput=()=>{const id=i.dataset.sl,k=i.dataset.k,v=+i.value;if(!Number.isFinite(v)||v<=0)return;V[id][k]=v;$$(`input[data-sl="${id}"][data-k="${k}"]`).forEach(o=>{if(o!==i)o.value=i.value});const f=FS.find(x=>x.id===(id==='g5s'?'g5':id)),o=$(`[data-out="${id==='g5s'?'g5':id}"]`);if(o)o.innerHTML=f.out()});
 $$('[data-th2]').forEach(b=>b.onclick=()=>{st.th=st.th===b.dataset.th2?'all':b.dataset.th2;drawFilters();renderAll()});
 $$('.opt[data-q]').forEach(b=>b.onclick=()=>{st.qa[+b.dataset.q]=+b.dataset.o;renderAll()});
 const r=$('#qReset');if(r)r.onclick=()=>{st.qa={};renderAll()};
}
const tl=$('#tablist');
TABS.forEach(([id,n])=>{const b=document.createElement('button');b.className='tab';b.id='t-'+id;b.setAttribute('role','tab');b.setAttribute('aria-controls','p-'+id);b.textContent=n;b.onclick=()=>go(id);tl.append(b);
 const s=document.createElement('section');s.className='panel';s.id='p-'+id;s.setAttribute('role','tabpanel');s.setAttribute('aria-labelledby','t-'+id);s.hidden=true;$('#main').append(s)});
$('#main').insertAdjacentHTML('beforeend',foot());
function go(id,fromHash){if(!TABS.some(t=>t[0]===id))id='datos';
 TABS.forEach(([t])=>{$('#p-'+t).hidden=t!==id;const b=$('#t-'+t);b.setAttribute('aria-selected',t===id);b.tabIndex=t===id?0:-1});
 $('#filters').hidden=id!=='datos';
 hideTip();if(!fromHash){try{history.replaceState(null,'','#'+id)}catch(e){}}renderAll();$('#t-'+id).scrollIntoView({block:'nearest',inline:'center'})}
tl.addEventListener('keydown',e=>{const i=TABS.findIndex(t=>$('#t-'+t[0]).getAttribute('aria-selected')==='true');if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const j=(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length;go(TABS[j][0]);$('#t-'+TABS[j][0]).focus()}});
addEventListener('hashchange',()=>go(location.hash.slice(1),true));
drawFilters();go(location.hash.slice(1)||'datos',true);
</script>
